# 민감 값은 ${DAMSO_*} 환경변수 참조만 둔다.
# 필수 시크릿 검증: damso.common.config.SecretsValidator
spring:
  application:
    name: damso
  datasource:
    url: ${DAMSO_DB_URL}
    username: ${DAMSO_DB_USERNAME}
    password: ${DAMSO_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # F1 팀 결정: 마이그레이션 도구 없이 엔티티 매핑으로 테이블 생성
      ddl-auto: update
  servlet:
    multipart:
      # 파일 업로드는 MVP에서 뺐다. 켜 두면 공개 경로에서도 multipart 본문을 디스크에 받아 파싱한다
      enabled: false
  jackson:
    deserialization:
      # 계약(additionalProperties: false)대로 알 수 없는 필드는 거부한다. 연락처 같은 필드를 몰래 받지 않는다
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${DAMSO_REDIS_HOST}
      port: ${DAMSO_REDIS_PORT}
      password: ${DAMSO_REDIS_PASSWORD:}
      # 명시하지 않으면 명령 대기가 60초다. Redis 장애 때 DB 커넥션을 쥔 요청이 오래 묶이지 않게 짧게 끊는다(fail-closed)
      timeout: 2s
      connect-timeout: 2s
      # Redis는 실패 횟수·발송 제한 TTL 키에만 쓴다. Spring Data Redis 리포지토리는 쓰지 않는다
      repositories:
        enabled: false
  mail:
    host: ${DAMSO_MAIL_HOST}
    port: ${DAMSO_MAIL_PORT}
    username: ${DAMSO_MAIL_USERNAME:}
    password: ${DAMSO_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${DAMSO_MAIL_STARTTLS:true}
          starttls:
            enable: ${DAMSO_MAIL_STARTTLS:true}
            # 서버가 STARTTLS를 내주지 않으면(중간에서 지워져도) 평문으로 넘어가지 않고 보내기를 실패시킨다
            required: ${DAMSO_MAIL_STARTTLS:true}
          # 기본값은 무한 대기다. 메일 서버가 응답하지 않아도 발송 스레드(@Async 공용)가 묶이지 않게 끊는다(밀리초)
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
  task:
    scheduling:
      pool:
        # 기본 1개면 외부 AI가 느린 동안 정리 작업이 스레드를 쥐어 긴급 알림 재시도가 밀린다. 스케줄 작업(정리·알림·정리 삭제)마다 하나씩
        size: 3

damso:
  crypto:
    column-key: ${DAMSO_COLUMN_ENCRYPTION_KEY}
    code-hash-key: ${DAMSO_CODE_HASH_KEY}
  jwt:
    secret: ${DAMSO_JWT_SECRET}
  openai:
    api-key: ${DAMSO_OPENAI_API_KEY}
    # 모델 이름은 코드에 두지 않고 배포 환경에서 정한다 (D2)
    model: ${DAMSO_OPENAI_MODEL}
    timeout:
      connect: 3s
      # 외부 AI 한 번의 처리 시간 상한. 넘으면 응답 없음으로 보고 실패와 같이 다룬다
      read: 15s
  mail:
    from: ${DAMSO_MAIL_FROM}
  auth:
    access-token-ttl: 15m
    session-ttl: 14d
  fcm:
    credentials: ${DAMSO_FCM_CREDENTIALS}
  notification:
    dispatch-interval: 10s
    urgent-reminder-interval: 1h
    retry-delays: 1m,5m,15m
  inquiry:
    submit-interval: 60s
    # 앱에서 쓰지 않는 "답변 완료" 종료 경로. false면 POST .../close가 404
    close-enabled: false
  answer-review:
    # 답변 점검 한 번의 처리 상한(가명화·외부 AI·검증·복원). 넘으면 점검 실패로 응답한다 — 10초 안에 맞춘 값
    timeout: 8s
  refinement:
    # 정리 작업 안전망 실행 주기. 평소에는 접수 커밋 직후 바로 실행한다
    dispatch-interval: 10s
    dispatch-on-commit: true
    lease: 60s
  super-admin:
    email: ${DAMSO_SUPER_ADMIN_EMAIL:}
    password: ${DAMSO_SUPER_ADMIN_PASSWORD:}

server:
  # Caddy가 넘기는 X-Forwarded-For로 실제 요청 위치를 읽는다(재설정 메일 제한, 이슈 #22).
  # Tomcat은 내부 대역(사설 IP)에서 온 연결의 헤더만 믿는다 — 앱 포트를 외부에 열지 않는다(운영 확인 2026-10-28)
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # 쿠버네티스 프로브 그룹 목록을 응답에 넣지 않는다 (contract: status만)
      probes:
        enabled: false
  health:
    # SMTP 연결을 health 호출마다 시도하지 않는다 (메일 서버 장애가 서버 상태 DOWN으로 번지지 않게)
    mail:
      enabled: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: INFO
