openapi: 3.0.3
info:
  title: DAMSO API
  version: 0.12.0
  description: |
    담소 통합 API 명세 (원본). 변경 시 이 파일을 먼저 수정하고 api-vX.Y 태그를 찍는다.
    - 인증: Authorization 헤더의 Bearer 토큰(HS256). 쿠키·세션 없음.
    - 모든 오류는 ErrorResponse 형식. 스택트레이스·예외명·내부 경로·SQL 없음.
    - 식별자는 UUID만 노출.
    - 요청·응답 본문은 JSON만. 다른 Content-Type(XML·multipart 등)의 본문은 415 UNSUPPORTED_MEDIA_TYPE이고, 응답은 Accept 헤더와 관계없이 JSON이다.
    - 감사 기록(F5): 원문·번역본 열람과 재시도 요청·점검 요청·종료는 감사 기록을 남긴다. 원문 열람은 기록 저장이 실패하면 500 INTERNAL_ERROR이고 원문을 내보내지 않는다. 번역본 열람·재시도 요청·점검 요청·종료는 기록이 실패해도 정상 처리한다(실패는 서버 로그에만 남는다). 거부된 요청(401·403·404·409)은 기록하지 않는다. 감사 기록 조회 API는 없다.
    - 답변 점검(F4)은 가명화 게이트웨이를 거쳐 외부 AI로 점검한다(api 0.12.0, 이슈 #33). 점검이 실패해도(available=false) 전송을 막지 않는다(fail-open). `reviewed`는 "점검을 요청했는지"만 의미하고 "점검 완료"를 보증하지 않는다.
    출처: specs/000-foundation (공통 기반), specs/001-auth-signup (F1 인증·회원가입·학급 연결), specs/002-inquiry-intake-urgent (F2 문의 접수·긴급 분류), specs/003-pseudonymization-pipeline (F3 가명화·정제 파이프라인), specs/004-answer-review-send (F4 답변 작성·점검·전송), specs/005-threat-expression-flag (위협·폭언 표현 표시), specs/006-audit-log-history (F5 감사 로그·이력 보존)
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 가입·로그인·세션·비밀번호 (로그인 전 단계는 공개)
  - name: me
    description: 마이페이지 (모든 역할)
  - name: parent
    description: 학부모 전용
  - name: teacher
    description: 교사 전용
  - name: admin
    description: 슈퍼 관리자 전용. 민원 내용 접근 경로 없음
  - name: admin-inquiry
    description: 슈퍼 관리자 문의 현황(건수만, 내용 없음)
  - name: parent-inquiry
    description: 학부모 문의 작성·조회
  - name: teacher-inquiry
    description: 교사 문의 목록·원문 열람
  - name: teacher-answer
    description: 교사 답변 작성·점검·전송·종료
  - name: parent-follow-up
    description: 학부모 재문의
  - name: notification
    description: 기기 등록·교사 알림 설정
  - name: parent-notification
    description: 학부모 답변 도착 알림 설정


paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: 서버 상태 확인 (유일한 공개 경로)
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [UP]
                required: [status]
                additionalProperties: false
        '503':
          description: 비정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [DOWN]

  # ───────────── auth (공개) ─────────────
  /api/v1/auth/invite-codes/verify:
    post:
      tags: [auth]
      operationId: checkInviteCode
      summary: 가입 전 초대 코드 확인 — 코드가 정하는 역할만 응답
      description: |
        코드가 정하는 역할(TEACHER·PARENT)만 알려 주고 학급·학생 등 연결 대상은 알려 주지 않는다(FR-011a).
        코드를 소모하지 않는다. 가입 1단계가 코드를 다시 검증하므로, 그사이 재발행·만료·사용되면 가입에서 INVALID_INVITE_CODE가 난다.
        실패 응답과 실패 횟수는 가입 1단계와 같다. 실패는 email 기준으로 세고 가입 1단계 실패와 합산된다. 5회 실패 시 10분 잠금.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteCodeCheckRequest' }
      responses:
        '200':
          description: 쓸 수 있는 코드
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteCodeCheckResponse' }
        '400':
          description: 입력 검증 실패(INVALID_INPUT) 또는 초대 코드 무효(INVALID_INVITE_CODE, 사유 구분 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidCode: { value: { code: INVALID_INVITE_CODE, message: 코드를 확인해 주세요. } }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/signup:
    post:
      tags: [auth]
      operationId: startSignup
      summary: 가입 1단계 — 초대 코드 검증 후 이메일 인증 코드 발송
      description: |
        초대 코드가 역할과 연결 대상을 정한다(요청에 역할·학급·학생 필드 없음, FR-015).
        이미 가입된 이메일이어도 같은 202 응답을 주고, 그 주소로 안내 메일만 보낸다(가입 여부 추측 차단).
        초대 코드 실패는 이메일 기준으로 센다. 5회 실패 시 10분 잠금.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '202':
          description: 인증 코드 발송(또는 안내 메일 발송)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingSignupResponse' }
        '400':
          description: 입력 검증 실패(INVALID_INPUT) 또는 초대 코드 무효(INVALID_INVITE_CODE, 사유 구분 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidCode: { value: { code: INVALID_INVITE_CODE, message: 코드를 확인해 주세요. } }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/signup/verify:
    post:
      tags: [auth]
      operationId: verifySignup
      summary: 가입 2단계 — 인증 코드 확인, 계정 확정·연결·로그인
      description: |
        한 트랜잭션에서 계정 생성 → 초대 코드 사용 처리 → 담임/보호자 연결 → 연결 이력 기록 → 토큰 발급.
        그 사이 초대 코드가 재발행·만료·사용되었으면 INVALID_INVITE_CODE.
        같은 초대 코드로 동시에 확정하면 1건만 성공한다(SC-008).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifySignupRequest' }
      responses:
        '201':
          description: 가입 완료, 로그인 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: INVALID_INPUT · INVALID_VERIFICATION_CODE · INVALID_INVITE_CODE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/signup/resend:
    post:
      tags: [auth]
      operationId: resendSignupCode
      summary: 가입 인증 코드 재발송 (이전 코드 무효, 60초 1회·시간당 5회)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pendingSignupId: { $ref: '#/components/schemas/Uuid' }
              required: [pendingSignupId]
              additionalProperties: false
      responses:
        '202': { description: 재발송 요청 접수 (대기 건이 없어도 같은 응답) }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 로그인 (기기마다 별도 세션)
      description: |
        없는 이메일·틀린 비밀번호·탈퇴 계정 모두 INVALID_CREDENTIALS(FR-023).
        연속 실패 3회부터 대기: 30초·1분·2분·5분·10분(상한). 대기 중 시도는 비밀번호가 맞아도 429(FR-024).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INVALID_CREDENTIALS, message: 이메일 또는 비밀번호가 올바르지 않습니다. }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 세션 갱신 — 갱신 토큰 1회 회전, 세션 만료 14일 연장
      description: |
        이미 사용된 갱신 토큰이 오면 그 세션(기기)만 폐기하고 401(FR-025, FR-025a).
        만료·폐기·없는 토큰 모두 UNAUTHORIZED(사유 구분 없음).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, maxLength: 64 }
              required: [refreshToken]
              additionalProperties: false
      responses:
        '200':
          description: 새 토큰 쌍
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: 재설정 코드 요청 (가입 여부와 관계없이 같은 응답)
      description: |
        발송 제한에 걸리면 가입 여부와 관계없이 429 TOO_MANY_ATTEMPTS + Retry-After. 제한은 가입 인증 메일과 따로 센다.
        - 같은 이메일 + 같은 요청 위치(IP): 60초 1회·1시간 5회
        - 같은 이메일(모든 요청 위치 합산): 1시간 10통
        - 같은 요청 위치(모든 이메일 합산): 1시간 20회
        제한은 계정 조회 전에 판단하고 계정 조회·코드 발급은 응답 뒤에 하므로, 가입된 이메일과 가입 안 된 이메일의 응답 내용·시간이 같다(가입 여부 비노출).
        이메일만이 아니라 요청 위치까지 묶어 세므로, 남이 내 이메일로 요청해도 내 요청 위치에서는 바로 받을 수 있다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { $ref: '#/components/schemas/Email' }
              required: [email]
              additionalProperties: false
      responses:
        '202': { description: "\"입력한 이메일로 안내를 보냈습니다\" — 가입된 이메일일 때만 실제 발송" }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/password-reset/verify:
    post:
      tags: [auth]
      operationId: verifyPasswordResetCode
      summary: 재설정 코드 확인 (코드를 소모하지 않음, 실패 횟수는 셈)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetCodeRequest' }
      responses:
        '204': { description: 코드 유효 — 새 비밀번호 화면으로 }
        '400':
          description: INVALID_VERIFICATION_CODE (없음·만료·사용됨·미가입 구분 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: 새 비밀번호 설정 — 코드 소모, 모든 기기 로그아웃
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ResetCodeRequest'
                - type: object
                  properties:
                    newPassword: { $ref: '#/components/schemas/Password' }
                  required: [newPassword]
      responses:
        '204': { description: 변경 완료. 해당 계정의 모든 세션 폐기(FR-031) }
        '400':
          description: INVALID_INPUT(비밀번호 정책) · INVALID_VERIFICATION_CODE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  # ───────────── auth (인증 필요) ─────────────
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 이 기기만 로그아웃 (접근 토큰의 세션 폐기)
      responses:
        '204': { description: 로그아웃. 다른 기기의 세션은 유지(FR-026) }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────── me ─────────────
  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 내 정보
      description: |
        마이페이지의 연결된 학급은 역할별 API를 함께 불러 보여 준다(FR-037).
        교사는 GET /api/v1/teacher/classroom, 학부모는 GET /api/v1/parent/children.
      responses:
        '200':
          description: 본인 정보 (본인 이메일만 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      operationId: updateMe
      summary: 이름 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { $ref: '#/components/schemas/PersonName' }
              required: [name]
              additionalProperties: false
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/withdrawal:
    post:
      tags: [me]
      operationId: withdraw
      summary: 회원 탈퇴 (현재 비밀번호 재확인)
      description: |
        이메일·이름 비식별화, 모든 세션 폐기, 담임/보호자 연결 해제, 연결 이력 기록(FR-038, FR-038a).
        슈퍼 관리자는 탈퇴할 수 없다(FORBIDDEN) — 서버에서 관리한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 1, maxLength: 64 }
              required: [password]
              additionalProperties: false
      responses:
        '204': { description: 탈퇴 완료 }
        '401':
          description: UNAUTHORIZED · INVALID_CREDENTIALS(비밀번호 불일치)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────── parent ─────────────
  /api/v1/parent/children:
    get:
      tags: [parent]
      operationId: listMyChildren
      summary: 연결된 자녀 목록 + 각 담임 공개 프로필 (홈·마이페이지)
      responses:
        '200':
          description: 본인이 보호자인 학생만
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChildResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [parent]
      operationId: linkChild
      summary: 자녀 추가 — 학부모 초대 코드 입력 (실패 횟수는 계정 기준)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inviteCode: { $ref: '#/components/schemas/InviteCodeInput' }
              required: [inviteCode]
              additionalProperties: false
      responses:
        '201':
          description: 연결됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChildResponse' }
        '400':
          description: INVALID_INPUT · INVALID_INVITE_CODE (교사 코드·이미 보호자 있는 학생 포함, 사유 구분 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  # ───────────── teacher ─────────────
  /api/v1/teacher/profile:
    get:
      tags: [teacher]
      operationId: getMyTeacherProfile
      summary: 내 공개 프로필
      responses:
        '200':
          description: 공개 프로필
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [teacher]
      operationId: updateMyTeacherProfile
      summary: 공개 프로필 수정 (표시 이름 + 소개 60자)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeacherProfile' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherProfile' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/teacher/classroom:
    get:
      tags: [teacher]
      operationId: getMyClassroom
      summary: 담당 학급과 학생별 학부모 연결 현황 (학부모 이메일·이름 없음)
      responses:
        '200':
          description: 본인이 담임인 학급만
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherClassroomResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────── admin ─────────────
  /api/v1/admin/classrooms:
    get:
      tags: [admin]
      operationId: listClassrooms
      summary: 학급 목록
      responses:
        '200':
          description: 학급 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminClassroom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createClassroom
      summary: 학급 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grade: { type: integer, minimum: 1, maximum: 6 }
                classNumber: { type: integer, minimum: 1, maximum: 20 }
              required: [grade, classNumber]
              additionalProperties: false
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminClassroom' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/inquiry-status:
    get:
      tags: [admin-inquiry]
      operationId: getInquiryStatus
      summary: 학급별 문의 처리 현황 (건수만)
      description: |
        학급마다 스레드(최초 문의) 수를 세 묶음으로 나눠 돌려준다. 재문의는 따로 세지 않는다.
        - waiting: 아직 답변을 보내지 않았고 교사 확인 전(RECEIVED·DELIVERED·REFINING)
        - confirmed: 교사가 확인했고(TEACHER_CONFIRMED) 아직 답변을 보내지 않음
        - answered: 답변을 1건 이상 보냈거나 종료됨(ANSWERED). 앱의 "답변 완료" 태그와 같은 뜻이다
        답변 뒤 재문의 대기는 포함하지 않는다(목록 hasAnswer와 같은 기준) — 답변을 보낸 스레드는 그 뒤 답하지 않은 재문의가 있어도 answered로 센다.
        긴급 여부·원문 확인 필요 여부는 묶음에 드러나지 않는다(DELIVERED는 waiting에 합쳐진다).
        학생·학부모·교사 정보, 제목·본문은 없다. 문의가 없는 학급도 0으로 나온다.
        슈퍼 관리자만 호출할 수 있다. 이 조회는 감사 기록을 남기지 않는다.
      responses:
        '200':
          description: 학급별 현황
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryStatusSummary' }
              example:
                items:
                  - { classroomId: 3f6c1d2e-8a4b-4c1e-9f7a-2b5d8e9c0a11, waiting: 2, confirmed: 1, answered: 5 }
                  - { classroomId: 7a2e4b9c-1d3f-4e8a-b6c5-0f9e8d7c6b22, waiting: 0, confirmed: 0, answered: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/classrooms/{classroomId}/students:
    parameters:
      - { name: classroomId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [admin]
      operationId: listStudents
      summary: 학급 학생 명단과 보호자 연결 여부
      responses:
        '200':
          description: 학생 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      operationId: registerStudents
      summary: 학생 이름 등록 (한 번에 최대 40명)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items: { $ref: '#/components/schemas/PersonName' }
              required: [names]
              additionalProperties: false
      responses:
        '201':
          description: 등록된 학생
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudentSummary' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/classrooms/{classroomId}/teacher-invite:
    parameters:
      - { name: classroomId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [admin]
      operationId: issueTeacherInvite
      summary: 교사 초대 코드 발행·재발행 (이전 미사용 코드 즉시 무효)
      responses:
        '201':
          description: 발행됨. code 원문은 이 응답에서만 보인다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedInviteCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CLASSROOM_HAS_TEACHER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/admin/students/{studentId}/parent-invite:
    parameters:
      - { name: studentId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [admin]
      operationId: issueParentInvite
      summary: 학부모 초대 코드 발행·재발행 (학생 1명당 활성 코드 1개)
      responses:
        '201':
          description: 발행됨. code 원문은 이 응답에서만 보인다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedInviteCode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: STUDENT_HAS_GUARDIAN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/admin/invite-codes:
    get:
      tags: [admin]
      operationId: listInviteCodes
      summary: 발행 현황 (원문 없음)
      parameters:
        - { name: classroomId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200':
          description: 해당 학급의 교사·학부모 코드 이력
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InviteCodeStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/parent/inquiries:
    post:
      tags: [parent-inquiry]
      operationId: submitInquiry
      summary: 문의 제출 (자녀 선택, 자유 서술 최대 2,000자, 제목 없음)
      description: |
        순서: 입력 검증 → 중복 제출 확인(Idempotency-Key) → 긴급 판정(규칙, AI 이전) → 일반이면 1분 제한 → 저장.
        - 같은 Idempotency-Key가 다시 오면 처음 접수된 문의를 그대로 돌려준다(새로 만들지 않음, 1분 제한도 보지 않음). 단 자녀나 본문이 다르면 409 CONFLICT.
        - 1분 제한을 확인할 수 없는 서버 장애에서는 일반 문의도 제한만 건너뛰고 접수한다(문의권 우선).
        - 긴급 문의는 1분 제한을 받지 않고, 정제 없이 담임에게 바로 전달된다(stage DELIVERED).
        - 긴급 판정은 외부 AI·알림 장애와 무관하게 동작한다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 제출마다 앱이 새로 만든 UUID. 재시도할 때는 같은 값을 다시 보낸다. 같은 키로 자녀나 본문이 다른 제출을 보내면 409 CONFLICT로 거부한다.
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitInquiryRequest' }
      responses:
        '201':
          description: 접수됨(같은 키의 재전송도 같은 결과)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquirySubmitted' }
        '400':
          description: INVALID_INPUT(본문 비었음·2,000자 초과·Idempotency-Key 누락 등)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: NO_HOMEROOM_TEACHER(자녀의 학급에 담임이 아직 없음) 또는 CONFLICT(같은 Idempotency-Key로 자녀나 본문이 다른 제출)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: NO_HOMEROOM_TEACHER, message: 담임 선생님이 아직 연결되지 않았습니다. }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
    get:
      tags: [parent-inquiry]
      operationId: listMyInquiries
      summary: 내가 작성한 문의 목록 (최신순)
      responses:
        '200':
          description: 본인이 작성한 문의만
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ParentInquirySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/parent/inquiries/{inquiryId}:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [parent-inquiry]
      operationId: getMyInquiry
      summary: 내 문의 상세 — 원문, 처리 단계 타임라인, 안내
      responses:
        '200':
          description: 본인이 작성한 문의
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentInquiryDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/parent/inquiries/{inquiryId}/follow-ups:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [parent-follow-up]
      operationId: submitFollowUp
      summary: 같은 문의 스레드에 재문의
      description: |
        최초 문의와 같은 파이프라인(멱등키 → 중복 확인 → 대상 재확인 → 긴급 판정 → 1분 제한 → 저장)을 거친다.
        담임은 스레드 시작 시점으로 고정하지 않고 매번 다시 조회한다 — 담임이 바뀌었으면 새 담임에게, 담임이 해제·공석이면 409 NO_HOMEROOM_TEACHER로 거부한다.
        긴급으로 판정되면 1분 제한 없이 즉시 접수되고 F2의 즉시 전달 경로를 그대로 따른다.
        "답변 완료"로 종료된 문의에는 재문의할 수 없다(409 THREAD_CLOSED). 종료 경로가 운영에서 꺼져 있어 지금은 생기지 않는다.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: F2 문의 제출과 같은 규칙(재시도 시 같은 값, 다른 내용이면 409 CONFLICT)
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FollowUpRequest' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpSubmitted' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: THREAD_CLOSED(이미 종료됨 — 종료 경로가 운영에서 꺼져 있어 지금은 생기지 않는다) · NO_HOMEROOM_TEACHER(담임 해제·공석) · CONFLICT(같은 키로 다른 내용, 또는 다른 요청이 같은 문의를 처리하는 중이라 3초 안에 차례가 오지 않음 — 잠시 뒤 같은 키로 다시 보낸다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/teacher/inquiries:
    get:
      tags: [teacher-inquiry]
      operationId: listClassInquiries
      summary: 담당 학급 문의 목록 — 긴급이 먼저, 그다음 최신순
      parameters:
        - name: answerStatus
          in: query
          required: false
          description: |
            답변 여부로 거른다. 생략하거나 빈 값(`answerStatus=`)이면 거르지 않는다. 앞뒤 공백은 무시한다. 그 밖의 값(소문자 포함)은 400 INVALID_INPUT이다.
            - WAITING: 답변이 없거나, 마지막 답변 뒤에 재문의가 있는 스레드
            - ANSWERED: 답변이 있고 그 뒤에 재문의가 없는 스레드
            `totalElements`도 거른 결과 기준이다. 정렬(긴급이 먼저, 그다음 최신순)은 그대로다.
          schema: { type: string, enum: [WAITING, ANSWERED] }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 현재 담임인 학급의 문의만. 본문 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherInquiryPage' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/teacher/inquiries/{inquiryId}:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [teacher-inquiry]
      operationId: getClassInquiry
      summary: 문의 상세(본문 없음) — 처리 단계 타임라인
      responses:
        '200':
          description: 담당 학급의 문의
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherInquiryDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teacher/inquiries/{inquiryId}/content:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [teacher-inquiry]
      operationId: viewInquiryContent
      summary: 원문 열람 (일반·긴급) — 열람 기록이 남는다
      description: |
        원문을 돌려주기 전에 열람 시도 기록을 먼저 남기고(실패하면 원문을 내보내지 않는다), 원문을 내보내면 열람 완료 기록을 남긴다.
        단계 전이:
        - 긴급 문의: 처음 열람하면 TEACHER_CONFIRMED로 바뀌고 재알림이 멈춘다. 두 번째부터는 기록만 남는다.
        - 일반 문의 중 refinementStatus = NEEDS_ORIGINAL: 처음 열람하면 TEACHER_CONFIRMED.
        - 그 밖의 일반 문의: 단계가 바뀌지 않는다(번역본 첫 열람이 기준).
        정리 전이거나 정리 중인 문의도 열람할 수 있다. (0.4.0부터 INQUIRY_CONTENT_UNAVAILABLE을 응답하지 않는다)
      responses:
        '200':
          description: 원문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teacher/inquiries/{inquiryId}/refinement:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [teacher-inquiry]
      operationId: viewInquiryRefinement
      summary: 번역본 열람 — 사실관계·요청사항·정서강도
      description: |
        일반 문의의 정리 결과(번역본)를 돌려준다. 이름·학급은 원래 값으로 되돌려져 있다.
        **F5부터 번역본 열람도 감사 기록 대상이다.** 번역본을 돌려주기 전에 열람 시도 기록을, 내보낼 때 열람 완료 기록을 남긴다.
        원문 열람(/content)과 달리 **감사 기록 저장이 실패해도 번역본은 200으로 정상 반환한다**(실패는 서버 로그에만 남는다).
        500은 첫 열람의 확인 전이(TEACHER_CONFIRMED)가 충돌이 아닌 이유로 실패했을 때만 나며, 이때는 번역본을 내보내지 않는다.
        처음 열람하면 처리 단계가 TEACHER_CONFIRMED로 바뀐다(REFINING일 때). 두 번째부터는 기록만 남는다.
        번역본이 없으면(정리 전·원문 확인 필요·긴급 문의) 409 REFINEMENT_NOT_READY이며, 이때는 열람 기록을 남기지 않는다.
        담당 학급이 아니거나 없는 문의는 구분 없이 404이고, 열람 기록을 남기지 않는다.
      responses:
        '200':
          description: 번역본
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryRefinement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: REFINEMENT_NOT_READY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: REFINEMENT_NOT_READY, message: 아직 정리된 내용이 없습니다. }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/teacher/inquiries/{inquiryId}/refinement/retry:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-inquiry]
      operationId: retryInquiryRefinement
      summary: 자동 정리에 실패한 문의를 다시 정리한다 (문의 1건당 1회)
      description: |
        refinementStatus가 NEEDS_ORIGINAL이고 아직 재시도를 쓰지 않은 일반 문의만 받는다. 정리는 뒤에서 진행되고 결과는 상세의 refinementStatus로 확인한다.
        동시에 여러 번 요청해도 한 번만 실행되고 나머지는 409.
        재시도가 성공해도 교사에게 추가 알림은 가지 않는다.
        받아들여진 재시도는 누가 요청했는지 감사 기록(REFINEMENT_RETRY_REQUESTED)을 남긴다(F5). 기록은 재시도가 커밋된 뒤 요청 시각으로 남기며, 기록 저장이 실패해도 재시도는 202로 진행된다(실패는 서버 로그에만 남는다). 404·409로 거부된 요청과 동시 요청에서 진 쪽은 기록하지 않는다.
      responses:
        '202':
          description: 재시도를 시작했다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefinementRetryAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: REFINEMENT_RETRY_UNAVAILABLE (원문 확인 필요가 아님·이미 재시도함·긴급 문의·동시 요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: REFINEMENT_RETRY_UNAVAILABLE, message: 다시 정리할 수 없는 문의입니다. }

  /api/v1/teacher/inquiries/{inquiryId}/answer-reviews:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: requestAnswerReview
      summary: 전송 전 답변 점검 (선택)
      description: |
        답변 초안을 가명화 게이트웨이로 가린 뒤 외부 AI로 점검하고, 서버가 결과를 검증·복원해 오해 소지 표현·근거 누락을 짚어준다(api 0.12.0).
        - 맥락: 교사가 지금 답하려는 문의 하나(가장 최근 재문의, 없으면 스레드 루트)의 정리 결과만 쓴다. 이전 답변·다른 문의·원문은 쓰지 않는다.
        - 정리 결과가 없는 문의(긴급 문의·정리 실패)는 답변만 점검하고 근거 누락은 판단하지 않는다(contextUsed=false).
        - 외부 AI 장애·형식 오류·지적한 표현이 초안에 없음·처리 상한(10초 이내) 초과는 모두 200 available=false다. 지적 하나라도 검증에 실패하면 결과 전체를 버린다.
        - 점검 실패는 에러가 아니다 — 교사는 이 응답과 무관하게 바로 전송할 수 있다(원칙 V, fail-open). 결과는 저장하지 않는다.
        점검 요청마다 감사 기록(ANSWER_REVIEW_REQUESTED, 대상은 스레드 루트)을 점검 전에 남긴다(F5). 점검 서비스가 실패해도 기록은 남고 응답은 200 available=false다.
        감사 기록 저장이 실패해도 점검 요청은 정상 처리한다(실패는 서버 로그에만 남는다). 답변 전송(POST .../answers)은 영향을 받지 않는다. 400·404로 거부된 요청은 기록하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerReviewRequest' }
      responses:
        '200':
          description: 점검 결과(또는 실패 안내)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerReviewResult' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teacher/inquiries/{inquiryId}/answers:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: sendAnswer
      summary: 답변 전송 (점검 없이도 가능)
      description: |
        현재 담임인 학급의 문의에만 보낼 수 있다. 전송된 답변은 수정·삭제할 수 없다(원칙 III).
        학부모에게 알림이 가며(설정이 꺼져 있으면 저장만 되고 알림은 가지 않는다), 교사의 이 요청 없이는 어떤 경로로도 발송되지 않는다(원칙 V).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendAnswerRequest' }
      responses:
        '201':
          description: 전송됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSent' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: NEW_FOLLOW_UP(lastSeenFollowUpId가 스레드의 최신 재문의와 다름 — 답변을 쓰는 동안 재문의가 왔다. 상세를 다시 불러와 확인한 뒤 다시 보낸다) · THREAD_CLOSED(이미 "답변 완료"로 종료된 문의 — 종료 경로가 운영에서 꺼져 있어 지금은 생기지 않는다) · CONFLICT(다른 요청이 같은 문의를 처리하는 중이라 3초 안에 차례가 오지 않음 — 잠시 뒤 다시 보낸다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: NEW_FOLLOW_UP, message: 확인하지 않은 재문의가 있습니다. 스레드를 다시 불러온 뒤 보내 주세요. }

  /api/v1/teacher/inquiries/{inquiryId}/close:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: closeInquiry
      deprecated: true
      summary: '"답변 완료"로 종료 — 앱에서 쓰지 않음, 운영에서 꺼져 있음'
      description: |
        앱에서는 종료를 호출하지 않는다(decisions.md 2026-10-27). 운영 설정에서 이 경로는 꺼져 있다(damso.inquiry.close-enabled=false).
        꺼져 있으면 교사가 호출해도 담당 여부를 보기 전에 404 NOT_FOUND를 돌려주고 스레드는 열린 채로 남는다.
        교사가 아닌 사용자는 지금처럼 경로 단위 역할 검사에서 403이다.
        아래 200·409는 설정을 켰을 때의 동작이다(서버 검증 확인용). 교사의 명시적 동작으로만 종료되며(답변을 보낸다고 자동으로 종료되지 않는다), 종료 후에는 재문의·답변이 409 THREAD_CLOSED로 거부된다.
        설정을 켰을 때 종료가 성공하면 누가 닫았는지 감사 기록(INQUIRY_CLOSED)을 남긴다(F5). 기록은 종료가 커밋된 뒤 종료 시각으로 남기며, 기록 저장이 실패해도 종료는 200으로 완료된다(실패는 서버 로그에만 남는다). 거부된 요청(꺼져 있어서 받은 404 포함, 404·409)은 기록하지 않는다.
      responses:
        '200':
          description: 종료됨 (설정을 켰을 때만)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryClosed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 종료 경로가 꺼져 있음(운영 기본값), 또는 (켰을 때) 문의가 없거나 담당 학급 문의가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: NOT_FOUND, message: 요청한 대상을 찾을 수 없습니다. }
        '409':
          description: (설정을 켰을 때만) INQUIRY_NOT_READY_TO_CLOSE(아직 TEACHER_CONFIRMED에 닿지 않은 문의 — F3 전의 일반 문의 등) 또는 THREAD_CLOSED(이미 종료됨)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INQUIRY_NOT_READY_TO_CLOSE, message: 아직 종료할 수 없는 문의입니다. }

  /api/v1/teacher/notification-settings:
    get:
      tags: [notification]
      operationId: getNotificationSettings
      summary: 내 응답 가능 시간·일반 알림 설정 (설정 전이면 일반 알림 켜짐, 응답 가능 시간 없음 = 항상 응답 가능)
      responses:
        '200':
          description: 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [notification]
      operationId: updateNotificationSettings
      summary: 응답 가능 시간(요일당 한 구간)·일반 알림 켜기/끄기 저장. 이후 문의부터 적용
      description: 긴급 알림은 설정 대상이 아니다(항상 켜짐). availability를 빈 배열로 보내면 항상 응답 가능이 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationSettings' }
      responses:
        '200':
          description: 저장된 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSettings' }
        '400':
          description: INVALID_INPUT(시작이 종료보다 늦거나 같음, 같은 요일 중복, 시각 형식 오류)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/parent/notification-settings:
    get:
      tags: [parent-notification]
      operationId: getParentNotificationSettings
      summary: 답변 도착 알림 설정 조회
      responses:
        '200':
          description: 설정이 없으면 기본값(켜짐)으로 보인다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentNotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [parent-notification]
      operationId: updateParentNotificationSettings
      summary: 답변 도착 알림 켜기/끄기
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentNotificationSettings' }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentNotificationSettings' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/devices:
    put:
      tags: [notification]
      operationId: registerDevice
      summary: 이 기기를 알림 수신 기기로 등록(현재 로그인 세션에 묶임)
      description: |
        같은 토큰이 다시 오면 갱신한다. 이 세션에서 로그아웃하거나 비밀번호 재설정·탈퇴로 세션이 끝나면 이 기기로 알림이 가지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '204': { description: 등록됨 }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/devices/current:
    delete:
      tags: [notification]
      operationId: unregisterCurrentDevice
      summary: 이 세션에 등록된 기기 등록 해제
      responses:
        '204': { description: 해제됨(등록이 없어도 204) }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Uuid:
      type: string
      format: uuid
      description: 모든 리소스 식별자. 순번 ID는 노출하지 않는다.
      example: 3f2c9a1e-8b7d-4c5e-9f0a-1b2c3d4e5f60

    ErrorCode:
      type: string
      enum:
        - INVALID_INPUT
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
        - INVALID_INVITE_CODE
        - INVALID_VERIFICATION_CODE
        - INVALID_CREDENTIALS
        - TOO_MANY_ATTEMPTS
        - CLASSROOM_HAS_TEACHER
        - STUDENT_HAS_GUARDIAN
        - NO_HOMEROOM_TEACHER
        - INQUIRY_CONTENT_UNAVAILABLE
        - REFINEMENT_NOT_READY
        - REFINEMENT_RETRY_UNAVAILABLE
        - THREAD_CLOSED
        - INQUIRY_NOT_READY_TO_CLOSE
        - NEW_FOLLOW_UP
      description: 기능별 코드는 각 기능 contract에서 추가한다. 기존 코드의 의미는 바꾸지 않는다. F1이 6개(INVALID_INVITE_CODE 이하), F2가 2개(NO_HOMEROOM_TEACHER, INQUIRY_CONTENT_UNAVAILABLE), F3가 2개(REFINEMENT_NOT_READY, REFINEMENT_RETRY_UNAVAILABLE), F4가 2개(THREAD_CLOSED, INQUIRY_NOT_READY_TO_CLOSE), 이슈 #28이 1개(NEW_FOLLOW_UP, api 0.11.0)를 추가했다. INQUIRY_CONTENT_UNAVAILABLE은 0.4.0부터 응답하지 않는다(값은 남긴다).

    FieldError:
      type: object
      properties:
        field:
          type: string
          example: content
        reason:
          type: string
          description: 고정 문구. 입력값을 포함하지 않는다.
          example: 최대 2000자입니다
      required: [field, reason]
      additionalProperties: false

    ErrorResponse:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 코드별 고정 문구.
          example: 입력값이 올바르지 않습니다.
        fieldErrors:
          type: array
          description: code가 INVALID_INPUT일 때만 존재.
          items:
            $ref: '#/components/schemas/FieldError'
      required: [code, message]
      additionalProperties: false

    Email:
      type: string
      format: email
      maxLength: 254
      description: 대소문자 구분 없음(서버가 소문자로 정규화)
    Password:
      type: string
      minLength: 8
      maxLength: 64
      description: 영문 1자 이상 + 숫자 1자 이상
    PersonName:
      type: string
      minLength: 1
      maxLength: 20
    InviteCodeInput:
      type: string
      minLength: 10
      maxLength: 10
      pattern: '^[A-HJKMNP-Za-hjkmnp-z2-9]{10}$'
      description: 영문 대문자+숫자 10자리(0·O·1·I·L 제외). 소문자 입력은 대문자로 정규화
    VerificationCode:
      type: string
      pattern: '^[0-9]{6}$'
    Role:
      type: string
      enum: [SUPER_ADMIN, TEACHER, PARENT]

    InviteCodeCheckRequest:
      type: object
      properties:
        inviteCode: { $ref: '#/components/schemas/InviteCodeInput' }
        email: { $ref: '#/components/schemas/Email' }
      required: [inviteCode, email]
      additionalProperties: false
    InviteCodeCheckResponse:
      type: object
      properties:
        role:
          type: string
          enum: [TEACHER, PARENT]
      required: [role]
      additionalProperties: false
    SignupRequest:
      type: object
      properties:
        inviteCode: { $ref: '#/components/schemas/InviteCodeInput' }
        name: { $ref: '#/components/schemas/PersonName' }
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        termsAgreed:
          type: boolean
          description: true여야 한다
      required: [inviteCode, name, email, password, termsAgreed]
      additionalProperties: false
    PendingSignupResponse:
      type: object
      properties:
        pendingSignupId: { $ref: '#/components/schemas/Uuid' }
        codeExpiresInSeconds: { type: integer, example: 600 }
      required: [pendingSignupId, codeExpiresInSeconds]
      additionalProperties: false
    VerifySignupRequest:
      type: object
      properties:
        pendingSignupId: { $ref: '#/components/schemas/Uuid' }
        code: { $ref: '#/components/schemas/VerificationCode' }
      required: [pendingSignupId, code]
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 64 }
      required: [email, password]
      additionalProperties: false
    ResetCodeRequest:
      type: object
      properties:
        email: { $ref: '#/components/schemas/Email' }
        code: { $ref: '#/components/schemas/VerificationCode' }
      required: [email, code]
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string, description: 'JWT, 15분' }
        accessTokenExpiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: 1회용 opaque 값. 갱신마다 바뀐다 }
        refreshTokenExpiresInSeconds: { type: integer, example: 1209600, description: '14일, 갱신마다 다시 시작' }
        role: { $ref: '#/components/schemas/Role' }
      required: [accessToken, accessTokenExpiresInSeconds, refreshToken, refreshTokenExpiresInSeconds, role]
      additionalProperties: false

    MeResponse:
      type: object
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        email: { type: string, description: 본인 이메일 }
        role: { $ref: '#/components/schemas/Role' }
      required: [userId, name, email, role]
      additionalProperties: false

    ClassroomRef:
      type: object
      properties:
        classroomId: { $ref: '#/components/schemas/Uuid' }
        grade: { type: integer }
        classNumber: { type: integer }
      required: [classroomId, grade, classNumber]
      additionalProperties: false
    TeacherProfile:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 20 }
        introduction: { type: string, maxLength: 60 }
      required: [displayName, introduction]
      additionalProperties: false
    ChildResponse:
      type: object
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        classroom: { $ref: '#/components/schemas/ClassroomRef' }
        teacher:
          type: object
          allOf:
            - $ref: '#/components/schemas/TeacherProfile'
          nullable: true
          description: 담임 공개 프로필. 담임이 아직 없으면 null. 이메일 없음
      required: [studentId, studentName, classroom, teacher]
      additionalProperties: false
    StudentSummary:
      type: object
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        guardianLinked: { type: boolean }
      required: [studentId, name, guardianLinked]
      additionalProperties: false
    TeacherClassroomResponse:
      type: object
      properties:
        classroom: { $ref: '#/components/schemas/ClassroomRef' }
        students:
          type: array
          items: { $ref: '#/components/schemas/StudentSummary' }
      required: [classroom, students]
      additionalProperties: false

    InquiryStatusSummary:
      type: object
      properties:
        items:
          type: array
          description: 학급 목록(관리자 학급 목록과 같은 학급들). 순서는 학년·반 순
          items: { $ref: '#/components/schemas/ClassroomInquiryStatus' }
      required: [items]
      additionalProperties: false
    ClassroomInquiryStatus:
      type: object
      description: 학급 하나의 스레드 수. 세 값은 겹치지 않고 합이 그 학급의 스레드 수다
      properties:
        classroomId: { $ref: '#/components/schemas/Uuid' }
        waiting: { type: integer, minimum: 0 }
        confirmed: { type: integer, minimum: 0 }
        answered: { type: integer, minimum: 0 }
      required: [classroomId, waiting, confirmed, answered]
      additionalProperties: false
    AdminClassroom:
      type: object
      properties:
        classroomId: { $ref: '#/components/schemas/Uuid' }
        grade: { type: integer }
        classNumber: { type: integer }
        homeroomAssigned: { type: boolean, description: 담임 연결 여부(교사 이름·이메일 없음) }
        studentCount: { type: integer }
      required: [classroomId, grade, classNumber, homeroomAssigned, studentCount]
      additionalProperties: false
    IssuedInviteCode:
      type: object
      properties:
        inviteCodeId: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, example: 'K7M3QX9PRT', description: 원문. 이 응답에서 한 번만 제공 }
        expiresAt: { type: string, format: date-time }
      required: [inviteCodeId, code, expiresAt]
      additionalProperties: false
    InviteCodeStatus:
      type: object
      properties:
        inviteCodeId: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [TEACHER, PARENT] }
        studentId:
          type: string
          format: uuid
          nullable: true
          description: 학부모 코드일 때만
        studentName: { type: string, nullable: true }
        status: { type: string, enum: [UNUSED, USED, EXPIRED, REVOKED] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
      required: [inviteCodeId, kind, studentId, studentName, status, issuedAt, expiresAt, usedAt]
      additionalProperties: false

    InquiryStage:
      type: string
      description: |
        RECEIVED(접수) · DELIVERED(교사에게 전달됨, 긴급만) · REFINING(정제) · TEACHER_CONFIRMED(교사 확인) · ANSWERED(답변 완료, F4).
        REFINING은 "정제 중"이 아니라 "정제 완료"다 — 검증을 통과한 정리 결과(번역본)가 생긴 시점에 기록된다. 이름은 F2 계약이라 유지한다.
        일반: RECEIVED → REFINING → TEACHER_CONFIRMED → ANSWERED. 자동 정리에 실패한 문의는 원문 첫 열람 때 RECEIVED → TEACHER_CONFIRMED.
        긴급: RECEIVED → DELIVERED → TEACHER_CONFIRMED → ANSWERED
        앱에서는 종료를 호출하지 않아 ANSWERED가 생기지 않는다(decisions.md 2026-10-27). 답변 여부는 목록의 hasAnswer로 판단한다.
      enum: [RECEIVED, DELIVERED, REFINING, TEACHER_CONFIRMED, ANSWERED]

    NoticeCode:
      type: string
      description: |
        학부모 화면의 시스템 안내 코드. 앱은 아래 고정 문구를 그대로 표시하고 교사 명의와 구분해 시스템 발신으로 보여 준다.
        - RECEIVED: "문의가 접수되었습니다."
        - URGENT_DELIVERED: "선생님께 바로 전달했어요."
        - DEFERRED_TO_AVAILABLE_HOURS: "선생님 응답 가능 시간에 전달됩니다."
      enum: [RECEIVED, URGENT_DELIVERED, DEFERRED_TO_AVAILABLE_HOURS]

    HotlineCode:
      type: string
      description: |
        긴급 문의의 외부 상담·신고 번호. 앱은 아래 고정 문구를 표시한다.
        - SUICIDE_PREVENTION_109: "자살예방 상담전화 109"
        - CHILD_ABUSE_112: "아동학대 신고 112"
        위기 종류별: 자해 → [SUICIDE_PREVENTION_109], 학대 → [CHILD_ABUSE_112], 그 밖의 안전 → [], 분류 안 됨(F3 전 기본값) → [CHILD_ABUSE_112, SUICIDE_PREVENTION_109]
      enum: [SUICIDE_PREVENTION_109, CHILD_ABUSE_112]

    Content:
      type: string
      minLength: 1
      maxLength: 2000
      description: 자유 서술. 글자 수(코드 포인트) 기준 1~2,000자, 공백만은 안 된다. 서버가 코드 포인트로 다시 센다. maxLength는 안내용이며, 이모지처럼 UTF-16 길이가 더 긴 글자가 든 본문을 클라이언트 검증이 먼저 막지 않도록 최종 판단은 서버에 맡긴다

    SubmitInquiryRequest:
      type: object
      properties:
        studentId: { $ref: '#/components/schemas/Uuid' }
        content: { $ref: '#/components/schemas/Content' }
      required: [studentId, content]
      additionalProperties: false

    InquirySubmitted:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        urgent: { type: boolean }
        stage: { $ref: '#/components/schemas/InquiryStage' }
        submittedAt: { type: string, format: date-time }
        notices:
          type: array
          items: { $ref: '#/components/schemas/NoticeCode' }
        hotlines:
          type: array
          description: 긴급일 때만 값이 있다. 일반 문의는 빈 배열
          items: { $ref: '#/components/schemas/HotlineCode' }
      required: [inquiryId, urgent, stage, submittedAt, notices, hotlines]
      additionalProperties: false

    StageEvent:
      type: object
      properties:
        stage: { $ref: '#/components/schemas/InquiryStage' }
        occurredAt: { type: string, format: date-time }
      required: [stage, occurredAt]
      additionalProperties: false

    ParentInquirySummary:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        stage: { $ref: '#/components/schemas/InquiryStage' }
        submittedAt: { type: string, format: date-time }
        hasAnswer:
          type: boolean
          description: |
            이 스레드(최초 문의 + 모든 재문의)에 답변이 1건 이상 있으면 true. 문의 처리 단계(stage)나 종료 여부와 무관하다.
            앱은 이 값으로 "답변한 문의는 스레드로"를 판단한다(stage로 판단하지 않음).
        lastAnsweredAt:
          type: string
          format: date-time
          nullable: true
          description: 이 스레드의 마지막 답변 전송 시각. 답변이 없으면 null. 추가 답변이 오면 새 시각으로 바뀐다. 답변 본문은 목록에 담지 않는다
      required: [inquiryId, studentId, studentName, urgent, stage, submittedAt, hasAnswer, lastAnsweredAt]
      additionalProperties: false

    ParentInquiryDetail:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        content: { type: string, description: 본인이 쓴 원문 }
        urgent: { type: boolean }
        stage: { $ref: '#/components/schemas/InquiryStage' }
        submittedAt: { type: string, format: date-time }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/StageEvent' }
        notices:
          type: array
          items: { $ref: '#/components/schemas/NoticeCode' }
        hotlines:
          type: array
          items: { $ref: '#/components/schemas/HotlineCode' }
        followUps:
          type: array
          description: 이 스레드에 이어서 보낸 재문의(F4). 본인 글이라 본문이 평문으로 보인다. 시간순
          items: { $ref: '#/components/schemas/ParentFollowUpView' }
        answers:
          type: array
          description: 이 스레드의 답변(F4). 시간순
          items: { $ref: '#/components/schemas/AnswerView' }
      required: [inquiryId, studentId, studentName, content, urgent, stage, submittedAt, timeline, notices, hotlines, followUps, answers]
      additionalProperties: false

    TeacherInquirySummary:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        title:
          type: string
          description: '긴급 "긴급 문의", 정리 중 "정리 중", 자동 정리 실패 "원문 확인 필요", 정리 완료 시 번역본 제목'
        stage: { $ref: '#/components/schemas/InquiryStage' }
        refinementStatus:
          type: string
          nullable: true
          enum: [PENDING, REFINED, NEEDS_ORIGINAL]
          description: 'RefinementStatus 값. 긴급 문의는 null'
        threatFlagged: { $ref: '#/components/schemas/ThreatFlagged' }
        threadThreatFlagged:
          type: boolean
          description: |
            스레드 단위 위협·폭언 표시. 최초 문의(threatFlagged)나 재문의(TeacherFollowUpView.threatFlagged) 가운데
            하나라도 표시됐으면 true. 재문의에만 위협 표현이 있어도 교사가 목록에서 알아볼 수 있게 한다. 교사에게만 보인다.
        submittedAt: { type: string, format: date-time }
        hasAnswer:
          type: boolean
          description: 이 스레드(최초 문의 + 모든 재문의)에 답변이 1건 이상 있으면 true. stage나 종료 여부와 무관하다
        lastAnsweredAt:
          type: string
          format: date-time
          nullable: true
          description: 이 스레드의 마지막 답변 전송 시각. 답변이 없으면 null. 이전 담임이 보낸 답변도 포함한다
        lastFollowUpAt:
          type: string
          format: date-time
          nullable: true
          description: 이 스레드의 마지막 재문의 접수 시각(상세의 followUps[].submittedAt 가운데 가장 늦은 값). 재문의가 없으면 null
        needsAnswer:
          type: boolean
          description: |
            답변이 없거나(hasAnswer=false), 마지막 재문의가 마지막 답변보다 늦으면(lastFollowUpAt > lastAnsweredAt) true.
            `answerStatus=WAITING`에 걸리는 스레드와 같다. 두 시각이 같으면 false
      required: [inquiryId, studentId, studentName, urgent, title, stage, refinementStatus, threatFlagged, threadThreatFlagged, submittedAt, hasAnswer, lastAnsweredAt, lastFollowUpAt, needsAnswer]
      additionalProperties: false

    TeacherInquiryPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeacherInquirySummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
      required: [items, page, size, totalElements]
      additionalProperties: false

    TeacherInquiryDetail:
      type: object
      description: 본문·번역본은 없다. 원문은 /content(감사 기록), 번역본은 /refinement로 따로 연다
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        title: { type: string }
        stage: { $ref: '#/components/schemas/InquiryStage' }
        refinementStatus:
          type: string
          nullable: true
          enum: [PENDING, REFINED, NEEDS_ORIGINAL]
          description: 'RefinementStatus 값. 긴급 문의는 null'
        retryAvailable:
          type: boolean
          description: NEEDS_ORIGINAL이고 아직 교사 재시도를 쓰지 않았으면 true
        threatFlagged: { $ref: '#/components/schemas/ThreatFlagged' }
        submittedAt: { type: string, format: date-time }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/StageEvent' }
        followUps:
          type: array
          description: 이 스레드의 재문의(F4). 목록·상세와 같은 규칙으로 본문은 없고, 긴급만 /content로 열람한다. 시간순
          items: { $ref: '#/components/schemas/TeacherFollowUpView' }
        answers:
          type: array
          description: 이 스레드의 답변(F4, 교사 자신이 작성). 시간순
          items: { $ref: '#/components/schemas/AnswerView' }
      required: [inquiryId, studentId, studentName, urgent, title, stage, refinementStatus, retryAvailable, threatFlagged, submittedAt, timeline, followUps, answers]
      additionalProperties: false

    ThreatFlagged:
      type: boolean
      description: |
        접수 때 서버의 고정 표현 목록으로 원문을 검사해 정한 "위협·폭언 표현 포함" 표시. 외부 AI 결과와 무관하다.
        - 한 번 정해지면 바뀌지 않는다(정리 완료·원문 확인 필요·열람·재시도와 무관).
        - 긴급 문의는 항상 false(긴급 판정이 먼저다).
        - 판정에 실패한 문의도 false다(오탐 최소화).
        - 어떤 표현이 걸렸는지는 응답에 없다. 교사는 번역본(/refinement)이나 원문(/content)으로 내용을 확인한다.
        - 교사에게만 보인다. 학부모 API와 알림에는 없다.
        - 재문의(F4)도 접수할 때마다 같은 규칙으로 정한다(TeacherFollowUpView.threatFlagged).

    RefinementStatus:
      type: string
      description: |
        일반 문의의 정리 상태. 긴급 문의는 null(정리 대상 아님).
        - PENDING: 정리 중
        - REFINED: 번역본 있음
        - NEEDS_ORIGINAL: 자동 정리에 실패했다. 앱은 고정 문구 "자동 정리에 실패했습니다. 원문을 확인해 주세요"와 원문 열람 버튼, retryAvailable이면 재시도 버튼을 보여 준다
      enum: [PENDING, REFINED, NEEDS_ORIGINAL]

    EmotionLevel:
      type: string
      description: 정서강도 — LOW(낮음) · MEDIUM(보통) · HIGH(높음)
      enum: [LOW, MEDIUM, HIGH]

    EmotionLabel:
      type: string
      description: 감정 라벨 — ANXIETY(불안) · DISSATISFACTION(불만) · ANGER(분노) · WORRY(걱정) · FRUSTRATION(답답함) · SADNESS(슬픔)
      enum: [ANXIETY, DISSATISFACTION, ANGER, WORRY, FRUSTRATION, SADNESS]

    InquiryRefinement:
      type: object
      description: 번역본. 이름·학급은 원래 값으로 되돌려져 있다
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 30 }
        facts: { type: string, minLength: 1, maxLength: 1000, description: 사실관계 }
        requests: { type: string, maxLength: 1000, description: '요청사항. 없으면 빈 문자열' }
        emotionLevel: { $ref: '#/components/schemas/EmotionLevel' }
        emotionLabels:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/EmotionLabel' }
        refinedAt: { type: string, format: date-time }
      required: [inquiryId, title, facts, requests, emotionLevel, emotionLabels, refinedAt]
      additionalProperties: false

    RefinementRetryAccepted:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        refinementStatus: { $ref: '#/components/schemas/RefinementStatus' }
      required: [inquiryId, refinementStatus]
      additionalProperties: false

    InquiryContent:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        content: { type: string }
      required: [inquiryId, content]
      additionalProperties: false

    DayOfWeek:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    AvailabilityWindow:
      type: object
      description: 한국 시간. 시작 포함·종료 미포함, start < end. 자정을 넘는 구간은 두 요일로 나눠 보낸다
      properties:
        dayOfWeek: { $ref: '#/components/schemas/DayOfWeek' }
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '08:30' }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$', example: '17:00' }
      required: [dayOfWeek, start, end]
      additionalProperties: false

    NotificationSettings:
      type: object
      properties:
        generalEnabled: { type: boolean, description: 일반 문의 알림. 긴급 알림은 항상 켜짐 }
        availability:
          type: array
          maxItems: 7
          description: 요일당 한 구간. 빈 배열이면 항상 응답 가능
          items: { $ref: '#/components/schemas/AvailabilityWindow' }
      required: [generalEnabled, availability]
      additionalProperties: false

    RegisterDeviceRequest:
      type: object
      properties:
        token: { type: string, minLength: 1, maxLength: 512, description: FCM 등록 토큰 }
        platform: { type: string, enum: [ANDROID, IOS] }
      required: [token, platform]
      additionalProperties: false

    # ───────────── F4 답변 작성·점검·전송 ─────────────
    Highlight:
      type: object
      description: 점검이 짚어준 문제 표현 한 곳
      properties:
        excerpt: { type: string, description: 답변 초안에서 문제로 지적된 부분. 초안 안에 그대로 있는 문자열이다(같은 문자열이 여러 번 있으면 어느 곳인지는 구분하지 않는다) }
        reason: { type: string, description: 오해 소지·근거 누락 이유 }
        suggestion: { type: string, description: 대체 표현 제안 }
      required: [excerpt, reason, suggestion]
      additionalProperties: false

    AnswerReviewRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/Content' }
      required: [content]
      additionalProperties: false

    AnswerReviewResult:
      type: object
      properties:
        available:
          type: boolean
          description: 점검이 결과를 냈는지. false면 점검 실패 안내만 보여주고 전송은 그대로 가능하다
        contextUsed:
          type: boolean
          description: >-
            문의 정리 결과를 맥락으로 넣어 점검했는지(api 0.12.0). false면 답변만 점검했고 근거 누락은 판단하지 않았다.
            available=false면 항상 false다.
        highlights:
          type: array
          maxItems: 5
          description: available=true인데 비어 있으면 짚을 곳이 없다는 뜻이다. available=false면 항상 비어 있다
          items: { $ref: '#/components/schemas/Highlight' }
      required: [available, contextUsed, highlights]
      additionalProperties: false

    SendAnswerRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/Content' }
        reviewed:
          type: boolean
          description: >-
            전송 전 점검을 요청했는지만 기록한다(결과를 반영했는지는 구분하지 않음).
            "점검 완료"나 "안전 확인됨"을 의미하지 않는다 — 점검이 실패했거나(available=false) 교사가 제안을 반영하지 않았어도
            reviewed=true일 수 있다.
        lastSeenFollowUpId:
          type: string
          format: uuid
          nullable: true
          description: |
            교사가 답변을 쓰며 화면에서 본 마지막 재문의 id(상세 followUps의 마지막 항목 inquiryId). 재문의가 없었으면 null.
            키는 반드시 보내야 한다(빠지면 400 INVALID_INPUT). 스레드의 최신 재문의와 다르면 409 NEW_FOLLOW_UP이고 답변은 저장되지 않는다 —
            상세를 다시 불러와 새 재문의를 확인한 뒤 그 id로 다시 보낸다(api 0.11.0, 이슈 #28)
      required: [content, reviewed, lastSeenFollowUpId]
      additionalProperties: false

    AnswerSent:
      type: object
      properties:
        answerId: { $ref: '#/components/schemas/Uuid' }
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        sentAt: { type: string, format: date-time }
      required: [answerId, inquiryId, sentAt]
      additionalProperties: false

    AnswerView:
      type: object
      description: 스레드 타임라인에 포함되는 답변 하나
      properties:
        answerId: { $ref: '#/components/schemas/Uuid' }
        content: { type: string }
        reviewed: { type: boolean }
        sentAt: { type: string, format: date-time }
      required: [answerId, content, reviewed, sentAt]
      additionalProperties: false

    InquiryClosed:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        closedAt: { type: string, format: date-time }
      required: [inquiryId, closedAt]
      additionalProperties: false

    FollowUpRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/Content' }
      required: [content]
      additionalProperties: false

    FollowUpSubmitted:
      type: object
      description: >-
        이 재문의 자신의 접수 결과(F2 InquirySubmitted와 같은 모양). 긴급 재문의도 최초 문의와 같은 안내를
        받는다 — notices·hotlines는 최초 문의와 같은 규칙(urgent 여부·위기 종류·응답 가능 시간)으로 채워진다
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        threadRootId: { $ref: '#/components/schemas/Uuid' }
        urgent: { type: boolean }
        submittedAt: { type: string, format: date-time }
        notices:
          type: array
          items: { $ref: '#/components/schemas/NoticeCode' }
        hotlines:
          type: array
          description: 긴급일 때만 값이 있다. 일반 재문의는 빈 배열
          items: { $ref: '#/components/schemas/HotlineCode' }
      required: [inquiryId, threadRootId, urgent, submittedAt, notices, hotlines]
      additionalProperties: false

    ParentFollowUpView:
      type: object
      description: 스레드 타임라인에 포함되는 재문의 하나 — 학부모 본인 글이라 본문이 보인다
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        content: { type: string }
        urgent: { type: boolean }
        stage: { $ref: '#/components/schemas/InquiryStage' }
        submittedAt: { type: string, format: date-time }
        notices:
          type: array
          items: { $ref: '#/components/schemas/NoticeCode' }
        hotlines:
          type: array
          description: 긴급일 때만 값이 있다. 일반 재문의는 빈 배열
          items: { $ref: '#/components/schemas/HotlineCode' }
      required: [inquiryId, content, urgent, stage, submittedAt, notices, hotlines]
      additionalProperties: false

    TeacherFollowUpView:
      type: object
      description: 스레드 타임라인에 포함되는 재문의 하나 — 본문 없음(원문은 /content로만, 긴급만 열람 가능)
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        urgent: { type: boolean }
        title: { type: string }
        stage: { $ref: '#/components/schemas/InquiryStage' }
        threatFlagged: { $ref: '#/components/schemas/ThreatFlagged' }
        submittedAt: { type: string, format: date-time }
      required: [inquiryId, urgent, title, stage, threatFlagged, submittedAt]
      additionalProperties: false

    ParentNotificationSettings:
      type: object
      properties:
        answerNotifyEnabled:
          type: boolean
          description: 기본값 true. 꺼도 답변은 저장되고 앱에서 확인할 수 있다
      required: [answerNotifyEnabled]
      additionalProperties: false

  responses:
    InvalidInput:
      description: 입력 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: INVALID_INPUT
            message: 입력값이 올바르지 않습니다.
            fieldErrors:
              - { field: content, reason: 최대 2000자입니다 }
    Unauthorized:
      description: 토큰 없음·위조·만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: UNAUTHORIZED, message: 인증이 필요합니다. }
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: FORBIDDEN, message: 권한이 없습니다. }
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: 요청한 대상을 찾을 수 없습니다. }
    Conflict:
      description: 동시 수정 충돌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: CONFLICT, message: 다른 요청과 충돌했습니다. 다시 시도해 주세요. }
    PayloadTooLarge:
      description: 요청 크기 64KB 초과
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: PAYLOAD_TOO_LARGE, message: 요청 크기가 너무 큽니다. }
    InternalError:
      description: 그 외 모든 오류 (상세 원인 비노출)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INTERNAL_ERROR, message: 일시적인 오류가 발생했습니다. }
    TooManyAttempts:
      description: 잠금·대기 중 (TOO_MANY_ATTEMPTS)
      headers:
        Retry-After:
          description: 다시 시도할 수 있을 때까지 남은 초. 메일 발송 시간당 제한에 걸리면 최대 1시간
          schema: { type: integer, minimum: 1, maximum: 3600 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: TOO_MANY_ATTEMPTS, message: 잠시 후 다시 시도해 주세요. }