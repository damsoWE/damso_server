name: ci

# PR과 main 푸시마다 테스트·정적분석(SpotBugs + find-sec-bugs)을 돌리고, 운영 이미지를 빌드해 알려진 취약점(Trivy)을 검사한다.
# 하나라도 실패하면 검사가 실패로 표시된다. 브랜치 보호 규칙에서 test·image-scan을 필수 검사로 지정하면 머지가 막힌다.
# (이슈 #26)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # 통합 테스트는 Testcontainers로 PostgreSQL·Redis를 띄운다(러너의 Docker 사용)
      - name: Test and static analysis
        run: bash ./gradlew --no-daemon test spotbugsMain
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: build/reports/
          retention-days: 7

  image-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 운영과 같은 Dockerfile로 빌드한다(배포는 deploy.yml이 ARM으로 따로 빌드). 베이스 이미지는 항상 새로 받는다
      - name: Build image
        run: docker build --pull -t damso:ci .
      # 고칠 수 있는(패치가 나온) HIGH·CRITICAL 취약점이 OS 패키지나 라이브러리에 있으면 실패한다
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: damso:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
