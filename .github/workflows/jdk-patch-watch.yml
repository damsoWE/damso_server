name: jdk-patch-watch

# CVE-2026-91403(Java JSSE, CVSS 9.1) 대응 — 운영 이미지의 베이스(eclipse-temurin:21-jre)에 패치된 JDK가 올라왔는지 매일 확인한다.
# advisory(https://openjdk.org/groups/vulnerability/advisories/2026-10-21)상 21 계열은 21.0.13 이하가 영향 범위다.
# 21.0.13보다 높은 버전이 보이면 재배포 이슈를 한 번만 만든다(이미 같은 제목의 이슈가 있으면 다시 만들지 않는다).
# 재배포를 마치면 이 워크플로는 지운다.

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  BASE_IMAGE: eclipse-temurin:21-jre
  AFFECTED_UP_TO: 21.0.13
  ISSUE_TITLE: "[Chore] Temurin 21 패치 이미지 배포됨 — CVE-2026-91403 재배포 필요"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Base image JDK version
        id: version
        run: |
          # pull 진행 출력이 java -version 출력에 섞이지 않게 먼저 따로 받는다
          docker pull -q "$BASE_IMAGE" > /dev/null
          VERSION=$(docker run --rm "$BASE_IMAGE" java -version 2>&1 | sed -nE 's/.* version "([^"]+)".*/\1/p' | head -1)
          # 버전을 못 읽으면 조용히 patched=false로 남지 않게 실패시킨다
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::$BASE_IMAGE의 JDK 버전을 읽지 못했다: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$AFFECTED_UP_TO" ] \
            && [ "$(printf '%s\n' "$AFFECTED_UP_TO" "$VERSION" | sort -V | tail -1)" = "$VERSION" ]; then
            echo "patched=true" >> "$GITHUB_OUTPUT"
            echo "$BASE_IMAGE: $VERSION — 패치됨 (> $AFFECTED_UP_TO)"
          else
            echo "patched=false" >> "$GITHUB_OUTPUT"
            echo "$BASE_IMAGE: $VERSION — 아직 영향 범위 (<= $AFFECTED_UP_TO)"
          fi

      - name: Open redeploy issue once
        if: steps.version.outputs.patched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "CVE-2026-91403 in:title" --json number --jq length)
          if [ "$EXISTING" != "0" ]; then
            echo "이미 이슈가 있다 — 새로 만들지 않는다"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$(cat <<EOF
          \`$BASE_IMAGE\`에 패치된 JDK **$VERSION**이 올라왔습니다(영향 범위: $AFFECTED_UP_TO 이하).

          - [ ] Actions → \`deploy\` 워크플로 수동 실행(Run workflow)
          - [ ] 서버에서 \`docker exec damso-app-1 java -version\`이 $VERSION 이상인지 확인
          - [ ] \`.github/workflows/jdk-patch-watch.yml\` 삭제

          참고: https://openjdk.org/groups/vulnerability/advisories/2026-10-21
          EOF
          )"
