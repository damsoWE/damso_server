openapi: 3.0.3
info:
  title: DAMSO F4 Contract — 목록의 답변 여부·종료 경로 차단 (2026-10-28 추가)
  version: 0.7.0
  description: |
    docs/api/openapi.yaml(0.6.0)에 대한 변경분만 적는다. 공통 규칙(Bearer 헤더 인증, ErrorResponse, UUID만 노출)은 docs/api/openapi.yaml을 따른다.
    사람 리뷰(소유권 검증·에러 형식·UUID 노출) 후 docs/api/openapi.yaml에 반영하고 info.version을 0.7.0으로 올린다.
    1. ParentInquirySummary·TeacherInquirySummary에 hasAnswer·lastAnsweredAt 추가 (US6, FR-026~030)
    2. POST /api/v1/teacher/inquiries/{inquiryId}/close — deprecated. 운영에서 꺼져 있어 교사가 호출하면 404 NOT_FOUND (US7, FR-031)
    3. InquiryStage·THREAD_CLOSED 설명에 "앱에서는 생기지 않음" 메모 (decisions.md 2026-10-27)
    새 경로·새 ErrorCode 없음. 출처: specs/004-answer-review-send (2026-10-28 추가분)
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /api/v1/teacher/inquiries/{inquiryId}/close:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: closeInquiry
      deprecated: true
      summary: '"답변 완료"로 종료 — 앱에서 쓰지 않음, 운영에서 꺼져 있음'
      description: |
        앱에서는 종료를 호출하지 않는다(decisions.md 2026-10-27). 운영 설정에서 이 경로는 꺼져 있다(damso.inquiry.close-enabled=false).
        꺼져 있으면 교사가 호출해도 담당 여부를 보기 전에 404 NOT_FOUND를 돌려주고 스레드는 열린 채로 남는다.
        교사가 아닌 사용자는 지금처럼 경로 단위 역할 검사에서 403이다.
        아래 200·409는 설정을 켰을 때의 동작이다(서버 검증 확인용). 교사의 명시적 동작으로만 종료되며, 종료 후에는 재문의·답변이 409 THREAD_CLOSED로 거부된다.
      responses:
        '200':
          description: 종료됨 (설정을 켰을 때만)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryClosed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 종료 경로가 꺼져 있음(운영 기본값), 또는 (켰을 때) 문의가 없거나 담당 학급 문의가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: NOT_FOUND, message: 요청한 대상을 찾을 수 없습니다. }
        '409':
          description: (설정을 켰을 때만) INQUIRY_NOT_READY_TO_CLOSE 또는 THREAD_CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Unauthorized:
      description: 'docs/api/openapi.yaml #/components/responses/Unauthorized'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 'docs/api/openapi.yaml #/components/responses/Forbidden'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Uuid: { type: string, format: uuid }

    ErrorResponse:
      description: 'docs/api/openapi.yaml #/components/schemas/ErrorResponse'
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]

    InquiryClosed:
      description: 'docs/api/openapi.yaml #/components/schemas/InquiryClosed (변경 없음)'
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        closedAt: { type: string, format: date-time }
      required: [inquiryId, closedAt]

    ParentInquirySummary:
      description: |
        변경 후 전체 모양 (추가: hasAnswer, lastAnsweredAt).
        hasAnswer·lastAnsweredAt은 스레드 전체(최초 문의 + 모든 재문의)의 답변 기준이며, 문의 처리 단계(stage)나 종료 여부와 무관하다. 답변 본문은 담지 않는다.
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        stage: { type: string, description: 'docs/api/openapi.yaml #/components/schemas/InquiryStage' }
        submittedAt: { type: string, format: date-time }
        hasAnswer:
          type: boolean
          description: 이 스레드에 답변이 1건 이상 있으면 true. 앱은 이 값으로 "답변한 문의는 스레드로"를 판단한다(stage로 판단하지 않음)
        lastAnsweredAt:
          type: string
          format: date-time
          nullable: true
          description: 이 스레드의 마지막 답변 전송 시각. 답변이 없으면 null. 추가 답변이 오면 새 시각으로 바뀐다
      required: [inquiryId, studentId, studentName, urgent, stage, submittedAt, hasAnswer, lastAnsweredAt]
      additionalProperties: false

    TeacherInquirySummary:
      description: '변경 후 전체 모양 (추가: hasAnswer, lastAnsweredAt — 의미는 ParentInquirySummary와 같다). 나머지 필드 설명은 docs/api/openapi.yaml 그대로'
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        title: { type: string }
        stage: { type: string, description: 'docs/api/openapi.yaml #/components/schemas/InquiryStage' }
        refinementStatus: { type: string, nullable: true, enum: [PENDING, REFINED, NEEDS_ORIGINAL] }
        threatFlagged: { type: boolean }
        threadThreatFlagged: { type: boolean }
        submittedAt: { type: string, format: date-time }
        hasAnswer:
          type: boolean
          description: 이 스레드에 답변이 1건 이상 있으면 true
        lastAnsweredAt:
          type: string
          format: date-time
          nullable: true
          description: 이 스레드의 마지막 답변 전송 시각. 답변이 없으면 null
      required: [inquiryId, studentId, studentName, urgent, title, stage, refinementStatus, threatFlagged, threadThreatFlagged, submittedAt, hasAnswer, lastAnsweredAt]
      additionalProperties: false

# docs/api/openapi.yaml에 함께 더할 설명 메모 (스키마 변경 없음)
# - InquiryStage.description: "앱에서는 종료를 호출하지 않아 ANSWERED가 생기지 않는다(decisions.md 2026-10-27). 답변 여부는 목록의 hasAnswer로 판단한다."
# - POST .../follow-ups, POST .../answers의 409 THREAD_CLOSED 설명: "종료 경로가 운영에서 꺼져 있어 지금은 생기지 않는다."
