openapi: 3.0.3
info:
  title: DAMSO Contract — 일반 문의 위협·폭언 표현 표시
  version: 0.0.0-draft
  description: |
    이 기능이 바꾸는 API. 공통 규칙(Bearer 헤더 인증, ErrorResponse, UUID만 노출)과 공통 스키마는 docs/api/openapi.yaml을 따른다.
    - 이 파일의 스키마는 사람 리뷰(소유권 검증·에러 형식·UUID 노출) 후 docs/api/openapi.yaml에 통합한다.
      버전은 병합 순서로 정한다: F4(features/f4-answer-review-send)가 먼저 병합되면 0.6.0, 이 기능이 먼저면 0.5.0 (research R10).
    - 권한은 F2·F3와 같다: 문의 담당 학급의 현재 담임만. 남의 문의는 404 NOT_FOUND, 학부모·슈퍼 관리자는 403. 새 엔드포인트는 없다.
    - threatFlagged는 교사에게만 보인다. 학부모 API(접수 응답·목록·상세)와 알림에는 없다.
    변경 요약
    - 변경: TeacherInquirySummary·TeacherInquiryDetail에 threatFlagged(boolean, 필수) 추가
    - 변경 없음: 경로·에러 코드·학부모 API·목록 정렬(긴급 먼저, 그다음 최신순)
    출처: specs/004-threat-expression-flag
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: teacher-inquiry
    description: 교사 문의 목록·상세

paths:
  /api/v1/teacher/inquiries:
    get:
      tags: [teacher-inquiry]
      operationId: listClassInquiries
      summary: 담당 학급 문의 목록 — 응답 항목에 threatFlagged 추가
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: 목록 (긴급 먼저, 그다음 최신순 — 변경 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherInquiryPage' }
        '400': { $ref: '../../../docs/api/openapi.yaml#/components/responses/InvalidInput' }
        '401': { $ref: '../../../docs/api/openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../../../docs/api/openapi.yaml#/components/responses/Forbidden' }

  /api/v1/teacher/inquiries/{inquiryId}:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/Uuid' } }
    get:
      tags: [teacher-inquiry]
      operationId: getClassInquiry
      summary: 문의 상세 — threatFlagged 추가
      responses:
        '200':
          description: 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherInquiryDetail' }
        '401': { $ref: '../../../docs/api/openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../../../docs/api/openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../../../docs/api/openapi.yaml#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ThreatFlagged:
      type: boolean
      description: |
        접수 때 서버의 고정 표현 목록으로 원문을 검사해 정한 "위협·폭언 표현 포함" 표시. 외부 AI 결과와 무관하다.
        - 한 번 정해지면 바뀌지 않는다(정리 완료·원문 확인 필요·열람·재시도와 무관).
        - 긴급 문의는 항상 false(긴급 판정이 먼저다).
        - 판정에 실패한 문의도 false다(오탐 최소화).
        - 어떤 표현이 걸렸는지는 응답에 없다. 교사는 번역본(/refinement)이나 원문(/content)으로 내용을 확인한다.

    TeacherInquirySummary:
      type: object
      properties:
        inquiryId: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/Uuid' }
        studentId: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        title:
          type: string
          description: '긴급 "긴급 문의", 정리 중 "정리 중", 자동 정리 실패 "원문 확인 필요", 정리 완료 시 번역본 제목'
        stage: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/InquiryStage' }
        refinementStatus:
          type: string
          nullable: true
          enum: [PENDING, REFINED, NEEDS_ORIGINAL]
          description: 'RefinementStatus 값. 긴급 문의는 null'
        threatFlagged: { $ref: '#/components/schemas/ThreatFlagged' }
        submittedAt: { type: string, format: date-time }
      required: [inquiryId, studentId, studentName, urgent, title, stage, refinementStatus, threatFlagged, submittedAt]
      additionalProperties: false

    TeacherInquiryPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeacherInquirySummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
      required: [items, page, size, totalElements]
      additionalProperties: false

    TeacherInquiryDetail:
      type: object
      description: 본문·번역본은 없다. 원문은 /content(감사 기록), 번역본은 /refinement로 따로 연다
      properties:
        inquiryId: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/Uuid' }
        studentId: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        title: { type: string }
        stage: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/InquiryStage' }
        refinementStatus:
          type: string
          nullable: true
          enum: [PENDING, REFINED, NEEDS_ORIGINAL]
          description: 'RefinementStatus 값. 긴급 문의는 null'
        retryAvailable:
          type: boolean
          description: NEEDS_ORIGINAL이고 아직 교사 재시도를 쓰지 않았으면 true
        threatFlagged: { $ref: '#/components/schemas/ThreatFlagged' }
        submittedAt: { type: string, format: date-time }
        timeline:
          type: array
          items: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/StageEvent' }
      required: [inquiryId, studentId, studentName, urgent, title, stage, refinementStatus, retryAvailable, threatFlagged, submittedAt, timeline]
      additionalProperties: false
