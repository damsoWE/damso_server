openapi: 3.0.3
info:
  title: DAMSO F4 Contract — 답변 작성·점검·전송
  version: 0.4.0
  description: |
    F4가 추가하는 API. 공통 규칙(Bearer 헤더 인증, ErrorResponse, UUID만 노출)은 docs/api/openapi.yaml을 따른다.
    - 이 파일의 경로·스키마·ErrorCode 추가분은 사람 리뷰(소유권 검증·에러 형식·UUID 노출) 후 docs/api/openapi.yaml에 통합한다.
    - **점검은 F3 연동 전까지 임시 상태다.** `POST .../answer-reviews`는 2026-10-25 결정에 따라 지금은 포트+스텁만 있어 `available=false`만 돌아온다. fail-open(FR-012)이므로 이 결과와 무관하게 전송은 항상 가능하다 — 즉 **F3가 실제 어댑터로 교체되기 전까지는 모든 답변이 실질적인 점검 없이 전송된다.** 프론트는 이 기간 동안 `reviewed=true`를 "점검 완료·안전 확인됨"으로 표시하면 안 된다(아래 `SendAnswerRequest.reviewed` 설명 참고).
    - 답변·재문의는 수정·삭제 API가 없다(원칙 III).
    - 기존 F2 `GET /api/v1/parent/inquiries/{inquiryId}`·`GET /api/v1/teacher/inquiries/{inquiryId}` 응답에 `answers`·`followUps` 필드가 추가된다. 정확한 통합 스키마는 F2 계약과 함께 사람 리뷰에서 확정한다.
    출처: specs/003-answer-review-send
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: teacher-answer
    description: 교사 답변 작성·점검·전송·종료
  - name: parent-follow-up
    description: 학부모 재문의
  - name: parent-notification
    description: 학부모 답변 도착 알림 설정

paths:
  /api/v1/teacher/inquiries/{inquiryId}/answer-reviews:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: requestAnswerReview
      summary: 전송 전 답변 점검 (선택)
      description: |
        답변 초안 + 그 문의(스레드)의 가명화된 맥락을 함께 참고해 오해 소지 표현·근거 누락을 짚어준다.
        가명화 게이트웨이(F3)가 아직 없어 지금은 항상 `available=false`를 돌려준다(점검 실패 안내).
        점검 실패는 에러가 아니다 — 교사는 이 응답과 무관하게 바로 전송할 수 있다(원칙 V, fail-open).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswerReviewRequest' }
      responses:
        '200':
          description: 점검 결과(또는 실패 안내)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerReviewResult' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teacher/inquiries/{inquiryId}/answers:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: sendAnswer
      summary: 답변 전송 (점검 없이도 가능)
      description: |
        현재 담임인 학급의 문의에만 보낼 수 있다. 전송된 답변은 수정·삭제할 수 없다(원칙 III).
        학부모에게 알림이 가며(설정이 꺼져 있으면 저장만 되고 알림은 가지 않는다), 교사의 이 요청 없이는 어떤 경로로도 발송되지 않는다(원칙 V).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendAnswerRequest' }
      responses:
        '201':
          description: 전송됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerSent' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: THREAD_CLOSED(이미 "답변 완료"로 종료된 문의)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: THREAD_CLOSED, message: 이미 종료된 문의입니다. }

  /api/v1/teacher/inquiries/{inquiryId}/close:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: closeInquiry
      summary: '"답변 완료"로 종료'
      description: |
        교사의 명시적 동작으로만 종료된다 — 답변을 보낸다고 자동으로 종료되지 않는다(FR-020).
        종료 후 학부모는 이 문의에서 재문의할 수 없고 새 문의를 작성해야 한다.
      responses:
        '200':
          description: 종료됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryClosed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INQUIRY_NOT_READY_TO_CLOSE(아직 TEACHER_CONFIRMED에 닿지 않은 문의 — F3 전의 일반 문의 등) 또는 THREAD_CLOSED(이미 종료됨)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INQUIRY_NOT_READY_TO_CLOSE, message: 아직 종료할 수 없는 문의입니다. }

  /api/v1/parent/inquiries/{inquiryId}/follow-ups:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [parent-follow-up]
      operationId: submitFollowUp
      summary: 같은 문의 스레드에 재문의
      description: |
        최초 문의와 같은 파이프라인(멱등키 → 중복 확인 → **대상 재확인** → 긴급 판정 → 1분 제한 → 저장)을 거친다.
        담임은 스레드 시작 시점으로 고정하지 않고 매번 다시 조회한다(F2와 같은 규칙) — 담임이 바뀌었으면 새 담임에게, 담임이 해제·공석이면 409 NO_HOMEROOM_TEACHER로 거부한다.
        긴급으로 판정되면 1분 제한 없이 즉시 접수되고 F2의 즉시 전달 경로를 그대로 따른다.
        "답변 완료"로 종료된 문의에는 재문의할 수 없다(409 THREAD_CLOSED).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: F2 문의 제출과 같은 규칙(재시도 시 같은 값, 다른 내용이면 409 CONFLICT)
          schema: { $ref: '#/components/schemas/Uuid' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FollowUpRequest' }
      responses:
        '201':
          description: 접수됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FollowUpSubmitted' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: THREAD_CLOSED(이미 종료됨) · NO_HOMEROOM_TEACHER(담임 해제·공석) · CONFLICT(같은 키로 다른 내용)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /api/v1/parent/notification-settings:
    get:
      tags: [parent-notification]
      operationId: getParentNotificationSettings
      summary: 답변 도착 알림 설정 조회
      responses:
        '200':
          description: 설정이 없으면 기본값(켜짐)으로 보인다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentNotificationSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [parent-notification]
      operationId: updateParentNotificationSettings
      summary: 답변 도착 알림 켜기/끄기
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParentNotificationSettings' }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParentNotificationSettings' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Uuid: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/Uuid' }
    FieldError: { $ref: '../../../docs/api/openapi.yaml#/components/schemas/FieldError' }

    ErrorCode:
      type: string
      description: docs/api/openapi.yaml의 기존 코드 + F4 추가 2개(THREAD_CLOSED, INQUIRY_NOT_READY_TO_CLOSE). 기존 코드의 의미는 바꾸지 않는다
      enum:
        - INVALID_INPUT
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - TOO_MANY_ATTEMPTS
        - NO_HOMEROOM_TEACHER
        - INQUIRY_CONTENT_UNAVAILABLE
        - THREAD_CLOSED
        - INQUIRY_NOT_READY_TO_CLOSE

    ErrorResponse:
      type: object
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
      required: [code, message]
      additionalProperties: false

    Content:
      type: string
      minLength: 1
      maxLength: 2000
      description: 자유 서술. F2의 InquiryContentPolicy와 같은 규칙(코드 포인트 1~2,000자, 공백만은 안 됨)

    Highlight:
      type: object
      description: 점검이 짚어준 문제 표현 한 곳
      properties:
        excerpt: { type: string, description: 답변에서 문제로 지적된 부분 }
        reason: { type: string, description: 오해 소지·근거 누락 이유 }
        suggestion: { type: string, description: 대체 표현 제안 }
      required: [excerpt, reason, suggestion]
      additionalProperties: false

    AnswerReviewRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/Content' }
      required: [content]
      additionalProperties: false

    AnswerReviewResult:
      type: object
      properties:
        available:
          type: boolean
          description: 점검이 결과를 냈는지. F3 전에는 항상 false(점검 실패 안내만 보여주고 전송은 그대로 가능)
        highlights:
          type: array
          items: { $ref: '#/components/schemas/Highlight' }
      required: [available, highlights]
      additionalProperties: false

    SendAnswerRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/Content' }
        reviewed:
          type: boolean
          description: >-
            전송 전 점검을 요청했는지만 기록한다(결과를 반영했는지는 구분하지 않음).
            **"점검 완료"나 "안전 확인됨"을 의미하지 않는다** — F3가 실제 가명화 게이트웨이로 연동되기 전까지
            점검은 항상 `available=false`만 돌려주는 임시 스텁이라, `reviewed=true`인 답변도
            실질적인 점검 효과는 없다. 프론트는 이 필드를 "점검 버튼을 눌렀는지"로만 표시해야 한다.
      required: [content, reviewed]
      additionalProperties: false

    AnswerSent:
      type: object
      properties:
        answerId: { $ref: '#/components/schemas/Uuid' }
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        sentAt: { type: string, format: date-time }
      required: [answerId, inquiryId, sentAt]
      additionalProperties: false

    InquiryClosed:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        closedAt: { type: string, format: date-time }
      required: [inquiryId, closedAt]
      additionalProperties: false

    FollowUpRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/Content' }
      required: [content]
      additionalProperties: false

    FollowUpSubmitted:
      type: object
      description: F2 InquirySubmitted와 같은 모양(이 재문의 자신의 접수 결과)
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        threadRootId: { $ref: '#/components/schemas/Uuid' }
        urgent: { type: boolean }
        submittedAt: { type: string, format: date-time }
      required: [inquiryId, threadRootId, urgent, submittedAt]
      additionalProperties: false

    ParentNotificationSettings:
      type: object
      properties:
        answerNotifyEnabled:
          type: boolean
          description: 기본값 true. 꺼도 답변은 저장되고 앱에서 확인할 수 있다
      required: [answerNotifyEnabled]
      additionalProperties: false

  responses:
    InvalidInput: { $ref: '../../../docs/api/openapi.yaml#/components/responses/InvalidInput' }
    Unauthorized: { $ref: '../../../docs/api/openapi.yaml#/components/responses/Unauthorized' }
    Forbidden: { $ref: '../../../docs/api/openapi.yaml#/components/responses/Forbidden' }
    NotFound: { $ref: '../../../docs/api/openapi.yaml#/components/responses/NotFound' }
    TooManyAttempts: { $ref: '../../../docs/api/openapi.yaml#/components/responses/TooManyAttempts' }
