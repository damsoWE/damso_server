openapi: 3.0.3
info:
  title: DAMSO F5 Contract — 감사 로그·이력 보존
  version: 0.7.0
  description: |
    F5가 추가·변경하는 API. 공통 규칙(Bearer 헤더 인증, ErrorResponse, UUID만 노출)은 docs/api/openapi.yaml을 따른다.
    - 이 파일의 추가·변경분은 사람 리뷰(소유권 검증·에러 형식·UUID 노출) 뒤 docs/api/openapi.yaml에 통합하고 api-v0.7 태그를 찍는다.
    - **감사 기록 조회 API는 없다.** 운영자는 contracts/operator-queries.md의 조회문으로 저장소를 직접 조회한다(spec FR-010).
    - 신규: `GET /api/v1/admin/inquiry-status` (슈퍼 관리자 현황).
    - 변경(설명만, 스키마 동일): `GET /api/v1/teacher/inquiries/{inquiryId}/refinement` — 번역본 열람이 감사 기록 대상이 된다(F3 → F5). 감사 기록이 실패해도 번역본은 정상 반환한다[팀 결정 2026-10-27].
    - 변경(설명만, 스키마 동일): `POST .../refinement/retry`, `POST .../answer-reviews`, `POST .../close` — 감사 기록을 남기되, 기록이 실패해도 요청은 정상 처리하고 서버 로그만 남긴다[팀 결정 2026-10-28]. 재시도·종료는 처리가 커밋된 뒤 기록한다(research R9).
    - 거부된 요청(401·403·404·409)은 감사 기록을 남기지 않는다. 다른 학급 문의와 없는 문의는 같은 404다.
    - 새 ErrorCode 없음.
    출처: specs/006-audit-log-history
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: admin-inquiry
    description: 슈퍼 관리자 문의 현황(메타데이터만)
  - name: teacher-inquiry
    description: 교사 문의 열람(F2·F3, 설명 변경)
  - name: teacher-answer
    description: 교사 답변(F4, 설명 변경)

paths:
  /api/v1/admin/inquiry-status:
    get:
      tags: [admin-inquiry]
      operationId: getInquiryStatus
      summary: 학급별 문의 처리 현황 (건수만)
      description: |
        학급마다 스레드(최초 문의) 수를 세 묶음으로 나눠 돌려준다. 재문의는 따로 세지 않는다.
        - waiting: 아직 답변을 보내지 않았고 교사 확인 전(RECEIVED·DELIVERED·REFINING)
        - confirmed: 교사가 확인했고(TEACHER_CONFIRMED) 아직 답변을 보내지 않음
        - answered: 답변을 1건 이상 보냈거나 종료됨(ANSWERED). 앱의 "답변 완료" 태그와 같은 뜻이다
        긴급 여부·원문 확인 필요 여부는 묶음에 드러나지 않는다(DELIVERED는 waiting에 합쳐진다).
        학생·학부모·교사 정보, 제목·본문은 없다. 문의가 없는 학급도 0으로 나온다.
        슈퍼 관리자만 호출할 수 있다. 이 조회는 감사 기록을 남기지 않는다.
      responses:
        '200':
          description: 학급별 현황
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryStatusSummary' }
              example:
                items:
                  - { classroomId: 3f6c1d2e-8a4b-4c1e-9f7a-2b5d8e9c0a11, waiting: 2, confirmed: 1, answered: 5 }
                  - { classroomId: 7a2e4b9c-1d3f-4e8a-b6c5-0f9e8d7c6b22, waiting: 0, confirmed: 0, answered: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/teacher/inquiries/{inquiryId}/refinement:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [teacher-inquiry]
      operationId: viewInquiryRefinement
      summary: 번역본 열람 — 열람 기록이 남는다 (F5에서 설명 변경, 스키마 동일)
      description: |
        일반 문의의 정리 결과(번역본)를 돌려준다. 이름·학급은 원래 값으로 되돌려져 있다.
        **F5부터 번역본 열람도 감사 기록 대상이다.** 번역본을 돌려주기 전에 열람 시도 기록을, 내보낼 때 열람 완료 기록을 남긴다.
        원문 열람(/content)과 달리 **감사 기록 저장이 실패해도 번역본은 200으로 정상 반환한다**(실패는 서버 로그에만 남는다).
        500은 첫 열람의 확인 전이(TEACHER_CONFIRMED)가 충돌이 아닌 이유로 실패했을 때만 나며, 이때는 번역본을 내보내지 않는다.
        처음 열람하면 처리 단계가 TEACHER_CONFIRMED로 바뀐다(REFINING일 때). 두 번째부터는 기록만 남는다.
        번역본이 없으면(정리 전·원문 확인 필요·긴급 문의) 409 REFINEMENT_NOT_READY이며, 이때는 열람 기록을 남기지 않는다.
        담당 학급이 아니거나 없는 문의는 구분 없이 404이고, 열람 기록을 남기지 않는다(내용에 닿기 전에 거부됨).
      responses:
        '200':
          description: 번역본
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryRefinement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: REFINEMENT_NOT_READY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: REFINEMENT_NOT_READY, message: 아직 정리된 내용이 없습니다. }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/teacher/inquiries/{inquiryId}/refinement/retry:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-inquiry]
      operationId: retryInquiryRefinement
      summary: 자동 정리에 실패한 문의를 다시 정리한다 (F5에서 설명 변경, 스키마 동일)
      description: |
        (기존 설명 유지) refinementStatus가 NEEDS_ORIGINAL이고 아직 재시도를 쓰지 않은 일반 문의만 받는다.
        **F5부터 받아들여진 재시도는 누가 요청했는지 감사 기록(REFINEMENT_RETRY_REQUESTED)을 남긴다.**
        기록은 재시도가 커밋된 뒤 요청 시각으로 남긴다. 기록 저장이 실패해도 재시도는 202로 진행된다(실패는 서버 로그에만 남는다).
        404·409로 거부된 요청과 동시 요청에서 진 쪽은 기록하지 않는다.
      responses:
        '202':
          description: 재시도를 시작했다 (기존 RefinementRetryAccepted 그대로)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: REFINEMENT_RETRY_UNAVAILABLE (기존 그대로)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: REFINEMENT_RETRY_UNAVAILABLE, message: 다시 정리할 수 없는 문의입니다. }

  /api/v1/teacher/inquiries/{inquiryId}/answer-reviews:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: requestAnswerReview
      summary: 전송 전 답변 점검 (F5에서 설명 변경, 스키마 동일)
      description: |
        (기존 설명 유지) 점검 실패는 에러가 아니다 — 교사는 이 응답과 무관하게 바로 전송할 수 있다(원칙 V, fail-open).
        **F5부터 점검 요청마다 감사 기록(ANSWER_REVIEW_REQUESTED, 대상은 스레드 루트)을 남긴다.** 기록은 점검을 부르기 전에 남긴다.
        점검 서비스가 실패하면 지금처럼 200 available=false이고 기록은 남는다.
        감사 기록 저장이 실패해도 점검 요청은 정상 처리한다(실패는 서버 로그에만 남는다). 답변 전송(POST .../answers)은 영향을 받지 않는다.
        400·404로 거부된 요청은 기록하지 않는다.
      responses:
        '200':
          description: 점검 결과(또는 실패 안내) (기존 AnswerReviewResult 그대로)
        '400':
          description: INVALID_INPUT (기존 그대로)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/teacher/inquiries/{inquiryId}/close:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-answer]
      operationId: closeInquiry
      summary: '"답변 완료"로 종료 — 앱은 쓰지 않는다 (F5에서 설명 변경, 스키마 동일)'
      description: |
        (기존 설명 유지) 교사의 명시적 동작으로만 종료된다.
        **앱은 이 경로를 쓰지 않는다**(docs/decisions.md 2026-10-27). 경로는 남아 있으므로, 호출되면 누가 닫았는지 감사 기록(INQUIRY_CLOSED)을 남긴다.
        기록은 종료가 커밋된 뒤 종료 시각으로 남긴다. 기록 저장이 실패해도 종료는 200으로 완료된다(실패는 서버 로그에만 남는다).
        404·409로 거부된 요청은 기록하지 않는다.
      responses:
        '200':
          description: 종료됨 (기존 InquiryClosed 그대로)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INQUIRY_NOT_READY_TO_CLOSE 또는 THREAD_CLOSED (기존 그대로)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INQUIRY_NOT_READY_TO_CLOSE, message: 아직 종료할 수 없는 문의입니다. }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  schemas:
    Uuid: { type: string, format: uuid }

    InquiryStatusSummary:
      type: object
      properties:
        items:
          type: array
          description: 학급 목록(관리자 학급 목록과 같은 학급들). 순서는 학년·반 순
          items: { $ref: '#/components/schemas/ClassroomInquiryStatus' }
      required: [items]
      additionalProperties: false

    ClassroomInquiryStatus:
      type: object
      description: 학급 하나의 스레드 수. 세 값은 겹치지 않고 합이 그 학급의 스레드 수다
      properties:
        classroomId: { $ref: '#/components/schemas/Uuid' }
        waiting: { type: integer, minimum: 0 }
        confirmed: { type: integer, minimum: 0 }
        answered: { type: integer, minimum: 0 }
      required: [classroomId, waiting, confirmed, answered]
      additionalProperties: false

    InquiryRefinement:
      description: 기존 docs/api/openapi.yaml 스키마 그대로(변경 없음)
      type: object

    ErrorResponse:
      description: 기존 docs/api/openapi.yaml 스키마 그대로(code + 고정 message, 스택트레이스·예외명·내부 경로·SQL 없음)
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]
      additionalProperties: false

  responses:
    Unauthorized:
      description: 토큰 없음·위조·만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: UNAUTHORIZED, message: 인증이 필요합니다. }
    Forbidden:
      description: '권한 없음 (역할이 맞지 않음 — 예: 교사·학부모가 관리자 현황 호출, 슈퍼 관리자가 교사 경로 호출)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: FORBIDDEN, message: 권한이 없습니다. }
    NotFound:
      description: 대상 없음 — 없는 문의와 다른 학급 문의를 구분하지 않는다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: NOT_FOUND, message: 요청한 대상을 찾을 수 없습니다. }
    InternalError:
      description: 원문 열람의 감사 기록 저장 실패, 번역본 첫 열람의 확인 전이 실패 등 — 내용은 나가지 않는다(고정 문구만, 내부 정보 없음)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: INTERNAL_ERROR, message: 일시적인 오류가 발생했습니다. }
