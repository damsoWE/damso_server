openapi: 3.0.3
info:
  title: DAMSO F3 Contract — 가명화·정제 파이프라인
  version: 0.4.0
  description: |
    F3가 추가·변경하는 API. 공통 규칙(Bearer 헤더 인증, ErrorResponse, UUID만 노출)은 docs/api/openapi.yaml을 따른다.
    - 이 파일의 경로·스키마·ErrorCode는 사람 리뷰(소유권 검증·에러 형식·UUID 노출) 후 docs/api/openapi.yaml에 통합하고 api-v0.4 태그를 찍는다.
    - 권한은 F2와 같다: 문의 담당 학급의 현재 담임만. 남의 문의는 존재 여부를 드러내지 않도록 404 NOT_FOUND, 학부모·슈퍼 관리자는 403.
    - 정리 결과(번역본)는 교사에게만 보인다. 학부모 응답 어디에도 정리 결과·정서강도·감정 라벨·실패 사유가 없다.
    - 번역본은 외부 AI 결과를 서버가 형식·허용값으로 다시 검증하고, 가명화 토큰을 원래 이름으로 되돌린 것이다. 검증을 통과하지 못한 결과는 어떤 응답에도 없다.
    변경 요약 (0.3.0 → 0.4.0)
    - 추가: GET /api/v1/teacher/inquiries/{inquiryId}/refinement, POST /api/v1/teacher/inquiries/{inquiryId}/refinement/retry
    - 변경: GET /api/v1/teacher/inquiries/{inquiryId}/content — 일반 문의도 열람 가능(INQUIRY_CONTENT_UNAVAILABLE 응답 없음)
    - 변경: TeacherInquirySummary·TeacherInquiryDetail에 refinementStatus, TeacherInquiryDetail에 retryAvailable
    - 변경 없음(형태): 학부모 API. 타임라인에 REFINING·TEACHER_CONFIRMED가 나타난다
    출처: specs/003-pseudonymization-pipeline
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: teacher-inquiry
    description: 교사 문의 목록·번역본·원문 열람·재시도

paths:
  /api/v1/teacher/inquiries/{inquiryId}/refinement:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [teacher-inquiry]
      operationId: viewInquiryRefinement
      summary: 번역본 열람 — 사실관계·요청사항·정서강도
      description: |
        일반 문의의 정리 결과(번역본)를 돌려준다. 이름·학급은 원래 값으로 되돌려져 있다.
        처음 열람하면 처리 단계가 TEACHER_CONFIRMED로 바뀐다(REFINING일 때). 두 번째부터는 단계가 바뀌지 않는다.
        번역본 열람은 감사 기록 대상이 아니다(원문 열람만 기록).
        번역본이 없으면(정리 전·원문 확인 필요·긴급 문의) 409 REFINEMENT_NOT_READY.
      responses:
        '200':
          description: 번역본
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryRefinement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: REFINEMENT_NOT_READY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: REFINEMENT_NOT_READY, message: 아직 정리된 내용이 없습니다. }

  /api/v1/teacher/inquiries/{inquiryId}/refinement/retry:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    post:
      tags: [teacher-inquiry]
      operationId: retryInquiryRefinement
      summary: 자동 정리에 실패한 문의를 다시 정리한다 (문의 1건당 1회)
      description: |
        refinementStatus가 NEEDS_ORIGINAL이고 아직 재시도를 쓰지 않은 일반 문의만 받는다. 정리는 뒤에서 진행되고 결과는 상세의 refinementStatus로 확인한다.
        동시에 여러 번 요청해도 한 번만 실행되고 나머지는 409.
        재시도가 성공해도 교사에게 추가 알림은 가지 않는다.
      responses:
        '202':
          description: 재시도를 시작했다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefinementRetryAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: REFINEMENT_RETRY_UNAVAILABLE (원문 확인 필요가 아님·이미 재시도함·긴급 문의·동시 요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: REFINEMENT_RETRY_UNAVAILABLE, message: 다시 정리할 수 없는 문의입니다. }

  /api/v1/teacher/inquiries/{inquiryId}/content:
    parameters:
      - { name: inquiryId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    get:
      tags: [teacher-inquiry]
      operationId: viewInquiryContent
      summary: 원문 열람 (일반·긴급) — 열람 기록이 남는다
      description: |
        원문을 돌려주기 전에 열람 시도 기록을 먼저 남기고(실패하면 원문을 내보내지 않는다), 원문을 내보내면 열람 완료 기록을 남긴다.
        단계 전이:
        - 긴급 문의: 처음 열람하면 TEACHER_CONFIRMED(F2와 같음).
        - 일반 문의 중 refinementStatus = NEEDS_ORIGINAL: 처음 열람하면 TEACHER_CONFIRMED.
        - 그 밖의 일반 문의: 단계가 바뀌지 않는다(번역본 첫 열람이 기준).
        정리 전이거나 정리 중인 문의도 열람할 수 있다.
      responses:
        '200':
          description: 원문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 역할 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 없는 문의 또는 담당이 아닌 문의
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Uuid:
      type: string
      format: uuid

    ErrorResponse:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]

    RefinementStatus:
      type: string
      description: |
        일반 문의의 정리 상태. 긴급 문의는 null(정리 대상 아님).
        - PENDING: 정리 중
        - REFINED: 번역본 있음
        - NEEDS_ORIGINAL: 자동 정리에 실패했다. 앱은 고정 문구 "자동 정리에 실패했습니다. 원문을 확인해 주세요"와 원문 열람 버튼, retryAvailable이면 재시도 버튼을 보여 준다
      enum: [PENDING, REFINED, NEEDS_ORIGINAL]

    EmotionLevel:
      type: string
      description: 정서강도 — LOW(낮음) · MEDIUM(보통) · HIGH(높음)
      enum: [LOW, MEDIUM, HIGH]

    EmotionLabel:
      type: string
      description: 감정 라벨 — ANXIETY(불안) · DISSATISFACTION(불만) · ANGER(분노) · WORRY(걱정) · FRUSTRATION(답답함) · SADNESS(슬픔)
      enum: [ANXIETY, DISSATISFACTION, ANGER, WORRY, FRUSTRATION, SADNESS]

    InquiryRefinement:
      type: object
      description: 번역본. 이름·학급은 원래 값으로 되돌려져 있다
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 30 }
        facts: { type: string, minLength: 1, maxLength: 1000, description: 사실관계 }
        requests: { type: string, maxLength: 1000, description: '요청사항. 없으면 빈 문자열' }
        emotionLevel: { $ref: '#/components/schemas/EmotionLevel' }
        emotionLabels:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/EmotionLabel' }
        refinedAt: { type: string, format: date-time }
      required: [inquiryId, title, facts, requests, emotionLevel, emotionLabels, refinedAt]
      additionalProperties: false

    RefinementRetryAccepted:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        refinementStatus: { $ref: '#/components/schemas/RefinementStatus' }
      required: [inquiryId, refinementStatus]
      additionalProperties: false

    InquiryContent:
      type: object
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        content: { type: string }
      required: [inquiryId, content]
      additionalProperties: false

    InquiryStage:
      type: string
      description: |
        RECEIVED(접수) · DELIVERED(교사에게 전달됨, 긴급만) · REFINING(정제) · TEACHER_CONFIRMED(교사 확인) · ANSWERED(답변 완료, F4).
        REFINING은 "정제 중"이 아니라 "정제 완료"다 — 검증을 통과한 정리 결과(번역본)가 생긴 시점에 기록된다. 이름은 F2 계약이라 유지한다.
        일반: RECEIVED → REFINING → TEACHER_CONFIRMED → ANSWERED. 자동 정리에 실패한 문의는 원문 첫 열람 때 RECEIVED → TEACHER_CONFIRMED.
        긴급: RECEIVED → DELIVERED → TEACHER_CONFIRMED → ANSWERED
      enum: [RECEIVED, DELIVERED, REFINING, TEACHER_CONFIRMED, ANSWERED]

    StageEvent:
      type: object
      properties:
        stage: { $ref: '#/components/schemas/InquiryStage' }
        occurredAt: { type: string, format: date-time }
      required: [stage, occurredAt]
      additionalProperties: false

    TeacherInquirySummary:
      type: object
      description: 0.4.0 — refinementStatus 추가
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        title:
          type: string
          description: '긴급 "긴급 문의", 정리 중 "정리 중", 자동 정리 실패 "원문 확인 필요", 정리 완료 시 번역본 제목'
        stage: { $ref: '#/components/schemas/InquiryStage' }
        refinementStatus:
          allOf: [{ $ref: '#/components/schemas/RefinementStatus' }]
          nullable: true
        submittedAt: { type: string, format: date-time }
      required: [inquiryId, studentId, studentName, urgent, title, stage, refinementStatus, submittedAt]
      additionalProperties: false

    TeacherInquiryDetail:
      type: object
      description: 0.4.0 — refinementStatus·retryAvailable 추가. 본문·번역본은 없다(/content, /refinement로 따로 연다)
      properties:
        inquiryId: { $ref: '#/components/schemas/Uuid' }
        studentId: { $ref: '#/components/schemas/Uuid' }
        studentName: { type: string }
        urgent: { type: boolean }
        title: { type: string }
        stage: { $ref: '#/components/schemas/InquiryStage' }
        refinementStatus:
          allOf: [{ $ref: '#/components/schemas/RefinementStatus' }]
          nullable: true
        retryAvailable:
          type: boolean
          description: NEEDS_ORIGINAL이고 아직 교사 재시도를 쓰지 않았으면 true
        submittedAt: { type: string, format: date-time }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/StageEvent' }
      required: [inquiryId, studentId, studentName, urgent, title, stage, refinementStatus, retryAvailable, submittedAt, timeline]
      additionalProperties: false
